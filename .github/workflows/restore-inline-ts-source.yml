name: 内嵌原始TypeScript源码恢复审计
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - 'tools/dev/restore-inline-ts-source.mjs'
      - '.github/workflows/restore-inline-ts-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装冻结TypeScript工具
        run: npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
      - name: 统计可信源码映射与可恢复类型缺口
        run: node tools/dev/restore-inline-ts-source.mjs
      - name: 保存逐文件恢复审计报告
        uses: actions/upload-artifact@v4
        with:
          name: inline-typescript-source-recovery
          path: .rebuild/governance/inline-ts-source-recovery.json
          retention-days: 30
