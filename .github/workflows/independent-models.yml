name: 333 独立模型协议与本地能力验证
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/api/multimodel/**'
      - 'src/services/auth/chatgptOAuth.ts'
      - 'src/services/localRuntime/**'
      - 'src/services/analytics/localDiagnostics.ts'
      - 'tests/multimodel-provider.test.ts'
      - 'tests/independent-local-features.test.ts'
      - '.github/workflows/independent-models.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-models-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  protocol:
    name: 模型协议、流式工具及账号目录模拟验证
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Windows 允许完整长路径检出
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 模拟各服务商请求并验证完整工具调用
        run: bun test tests/multimodel-provider.test.ts tests/independent-local-features.test.ts
