name: 2.1.317 新版源码直接对齐
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reusable-upgrade-direct-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-implementation:
    name: 对照317源码直接检查六层功能和缺口
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 从升级后的依赖完整重建CLI供真实行为验收
        run: |
          set -euo pipefail
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
          bun build/rebuild.mjs
          test -s dist/cli.js
      - name: 对照原版新增模型、压缩、权限与 Bash 功能链回归
        run: |
          node --test tests/m4-auth-status-parity-317.test.mjs tests/m2-disable-compact-settings-317.test.mjs tests/m2-auto-mode-rule-slots-317.test.mjs tests/m3-bash-shellopts-317.test.mjs tests/m2-terminal-hyperlink-forced-off-317.test.mjs
          node --test tests/m2-disable-ultrathink-317.test.mjs
          node --experimental-strip-types --test tests/m2-ultrathink-keyword-scope-317.test.mjs
      - name: 检查功能覆盖关系
        run: node build/upgrade-coverage.mjs
      - name: 扫描PR7源码与官方CLI差异
        run: node build/compare-317.mjs
      - name: 运行新版本对齐检查
        run: node --test tests/upgrade-coverage.test.mjs tests/compare-317.test.mjs tests/m1-target-release-317.test.mjs tests/m1-317-chain-matrix.test.mjs tests/m1-nested-session-id-317.test.mjs tests/m1-317-json-wire.test.mjs tests/m1-precompact-output-limit-317.test.mjs
