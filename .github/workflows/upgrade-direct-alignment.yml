name: 2.1.317 新版源码直接对齐
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/fixtures/claude-2.1.317-official-cli-help.json'
      - 'docs/upgrade/2.1.317-功能与场景源数据.json'
      - 'docs/upgrade/2.1.317-六层完整功能链路.json'
      - 'docs/upgrade/upgrade-coverage.json'
      - 'build/compare-317.mjs'
      - 'build/upgrade-coverage.mjs'
      - 'tests/compare-317.test.mjs'
      - 'tests/upgrade-coverage.test.mjs'
      - 'docs/upgrade/m1-evidence/2.1.317-366项功能链路分组矩阵.json'
      - 'tests/m1-317-chain-matrix.test.mjs'
      - 'tests/m1-nested-session-id-317.test.mjs'
      - 'tests/m1-317-json-wire.test.mjs'
      - 'tests/m1-precompact-output-limit-317.test.mjs'
      - 'tests/m2-*-317.test.mjs'
      - 'tests/m3-*-317.test.mjs'
      - 'src/utils/hooks/preCompactOutput.mjs'
      - 'src/utils/hooks.ts'
      - '.github/workflows/upgrade-direct-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-implementation:
    name: 对照317源码直接检查六层功能和缺口
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 对照原版新增模型、压缩、权限与 Bash 功能链回归
        run: |
          node --test tests/m2-disable-compact-settings-317.test.mjs tests/m2-auto-mode-rule-slots-317.test.mjs tests/m3-bash-shellopts-317.test.mjs
          node --test tests/m2-disable-ultrathink-317.test.mjs
      - name: 检查功能覆盖关系
        run: node build/upgrade-coverage.mjs
      - name: 扫描PR7源码与官方CLI差异
        run: node build/compare-317.mjs
      - name: 运行新版本对齐检查
        run: node --test tests/upgrade-coverage.test.mjs tests/compare-317.test.mjs tests/m1-target-release-317.test.mjs tests/m1-317-chain-matrix.test.mjs tests/m1-nested-session-id-317.test.mjs tests/m1-317-json-wire.test.mjs tests/m1-precompact-output-limit-317.test.mjs
