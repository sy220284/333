name: PR7 真实调用点TypeScript参数推断审计
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - 'tools/dev/infer-export-parameter-callers.mjs'
      - '.github/workflows/pr7-callsite-typed-parameters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 准备真实TS编译配置
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
          node tools/dev/dev.mjs typecheck:all
      - name: 从函数实际调用点反推出参数类型并记录来源
        run: node tools/dev/infer-export-parameter-callers.mjs
      - name: 保存参数来源与不可推断缺口
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-callsite-parameter-types
          path: .rebuild/governance/type-parameter-callsite-evidence.json
          retention-days: 30
          if-no-files-found: warn
