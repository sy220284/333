name: PR7 编译器推断返回类型恢复审计
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - 'tools/dev/infer-exported-ts-returns.mjs'
      - '.github/workflows/type-return-preview-pr7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装冻结TypeScript与依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 全仓类型检查并准备真实编译器上下文
        run: node tools/dev/dev.mjs typecheck:all
      - name: 统计可安全推断的导出返回类型
        run: node tools/dev/infer-exported-ts-returns.mjs
      - name: 保存逐函数推断数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-inferred-ts-return-preview
          path: .rebuild/governance/inferred-ts-return-types.json
          retention-days: 30
          if-no-files-found: warn
