name: M5 317 SDK MCP 实际执行验收
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - 'src/entrypoints/agentSdkTypes.ts'
      - 'src/services/mcp/InProcessTransport.ts'
      - 'tests/m5-sdk-mcp-factory-317.test.ts'
      - '.github/workflows/m5-sdk-mcp-317.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m5-sdk-mcp-317-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mcp-sdk:
    name: MCP工具注册、参数校验与真实调用
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 还原冻结项目依赖
        run: |
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: SDK实际MCP客户端到服务端调用
        run: bun test tests/m5-sdk-mcp-factory-317.test.ts
      - name: 全仓TypeScript接口检查
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node tools/dev/dev.mjs typecheck:all
