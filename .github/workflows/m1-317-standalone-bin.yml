name: M1 317 三平台无外部Bun依赖的自包含程序验证

on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/m1-317-standalone-bin.yml'
      - 'build/rebuild.mjs'
      - 'build/package-release.mjs'
      - 'build/public-dependencies.lock.json'
      - 'build/official-native-audio-317.json'
      - 'tests/m1-official-native-sources-317.test.mjs'
      - 'build/sync-all-official-native-317.mjs'
      - 'tests/release-integrity.test.mjs'
      - 'tests/m1-vendor-packaging-317.test.mjs'
      - 'tests/distribution-isolation.test.mjs'
      - 'src/utils/ripgrep.ts'
      - 'src/utils/ripgrepVendor317.mjs'
      - 'tests/m1-ripgrep-vendor-resolution-317.test.mjs'
      - 'src/entrypoints/cli.tsx'
      - 'src/bootstrap/jitPolicy317.mjs'
      - 'tests/m1-jit-startup-317.test.mjs'
      - 'src/bootstrap/relayTokenGuard317.mjs'
      - 'tests/m1-relay-token-guard-317.test.mjs'
      - 'src/entrypoints/runnerDeclaration317.mjs'
      - 'src/bootstrap/state.ts'
      - 'tests/m1-runner-declares-317.test.mjs'
      - 'src/bootstrap/processStart317.mjs'
      - 'src/bootstrap/processStart317.d.mts'
      - 'tests/m1-process-start-317.test.mjs'
      - 'tests/m1-preload-317.test.mjs'
      - 'tests/m1-bg-spare-317.test.mjs'
      - 'src/bootstrap/bgSpare317.ts'
      - 'src/bootstrap/bgSpare317.mjs'
      - 'src/bootstrap/preload317.ts'
      - 'src/bootstrap/preload317.mjs'
      - 'src/bootstrap/daemonWorker317.ts'
      - 'src/bootstrap/daemonWorker317.mjs'
      - 'tests/m1-daemon-worker-317.test.mjs'
      - 'src/bootstrap/ptyHost317.ts'
      - 'src/bootstrap/ptyHost317.mjs'
      - 'src/bootstrap/ptyWire317.ts'
      - 'src/bootstrap/ptyWire317.mjs'
      - 'tests/m1-pty-host-317.test.mjs'
      - 'tests/m1-version-verbose-317.test.mjs'
      - 'build/verify-official-native-by-platform.mjs'
      - 'native/audio-capture-src/index.ts'
      - 'tests/m1-native-audio-bundle-317.test.mjs'
      - 'tests/m1-coldstart-official-native-317.test.mjs'
      - 'tests/model-loop-local.test.mjs'
      - 'tests/search-loop-local.test.mjs'
      - 'tests/claude-api-version-parity.test.mjs'
      - 'src/utils/betas.ts'
      - 'src/utils/auth.ts'
      - 'src/commands/logout/logout.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-317-standalone-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  native-bundle:
    name: 验证源码编译的独立可执行文件 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Windows开启Git长路径
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 验签入库的官方六架构原生模块
        run: node --test tests/m1-official-native-sources-317.test.mjs
      - name: 317启动延迟JIT调优的原版语义与进程退出安全性
        run: node --test tests/m1-jit-startup-317.test.mjs
      - name: 官方317远程MCP令牌进程防转储及Linux prctl实际内核验收
        run: node --test tests/m1-relay-token-guard-317.test.mjs
      - name: 从真实源码独立重建317候选
        run: |
          set -euo pipefail
          node build/verify-bundled-assets.mjs
          node build/restore-claude-api.mjs --verify
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
          bun build/rebuild.mjs
      - name: Linux对照已验签317官方x64同步原生剪贴板与音频资源
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --http1.1 --retry-all-errors --retry 5 \
            'https://downloads.claude.ai/claude-code-releases/2.1.317/linux-x64/claude' \
            --output "$RUNNER_TEMP/claude-2.1.317"
          echo "eb224419e344575faa4a1f39b290b649425a10cd5ee2ef1d003480cd9ae57eb0  $RUNNER_TEMP/claude-2.1.317" | sha256sum --check
          chmod +x "$RUNNER_TEMP/claude-2.1.317"
          echo "CLAUDE_REFERENCE_BIN=$RUNNER_TEMP/claude-2.1.317" >> "$GITHUB_ENV"
          node build/sync-official-native-from-binary.mjs \
            --binary "$RUNNER_TEMP/claude-2.1.317" --vendor-root vendor --sync
      - name: 官方317原版Windows/macOS验签并直接比较原生音频模块
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          base='https://downloads.claude.ai/claude-code-releases/2.1.317'
          mkdir -p "$RUNNER_TEMP/m1-platform-reference"
          curl --fail --location --silent --show-error --retry-all-errors --retry 5             "$base/manifest.json" -o "$RUNNER_TEMP/m1-platform-reference/manifest.json"
          platform="$(node -p "process.platform+'-'+process.arch")"
          executable=claude
          if [ "$RUNNER_OS" = "Windows" ]; then executable=claude.exe; fi
          curl --fail --location --silent --show-error --retry-all-errors --retry 5             "$base/$platform/$executable" -o "$RUNNER_TEMP/m1-platform-reference/$executable"
          node build/verify-official-native-by-platform.mjs             --binary "$RUNNER_TEMP/m1-platform-reference/$executable"             --manifest "$RUNNER_TEMP/m1-platform-reference/manifest.json"             --vendor-root vendor --sync
          node build/verify-official-native-by-platform.mjs             --binary "$RUNNER_TEMP/m1-platform-reference/$executable"             --manifest "$RUNNER_TEMP/m1-platform-reference/manifest.json"             --vendor-root vendor
          node -e "const arch=process.arch+'-'+process.platform; const api=require('./vendor/audio-capture/'+arch+'/audio-capture.node'); if (!Object.keys(api).length) throw Error('Native audio exposes no functions')"
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "$RUNNER_TEMP/m1-platform-reference/$executable"; fi
          echo "CLAUDE_REFERENCE_BIN=$RUNNER_TEMP/m1-platform-reference/$executable" >> "$GITHUB_ENV"
      - name: 校验已验签平台音频模块在编译后Bun程序中的真实装载
        run: node --test tests/m1-native-audio-bundle-317.test.mjs
      - name: 生成自包含本机执行程序并打包完整发行资源
        run: |
          set -euo pipefail
          node build/compile-standalone.mjs
          node build/package-release.mjs
          if [ -f dist/claude.exe ]; then binary=dist/claude.exe; else binary=dist/claude; fi
          test -s "$binary"
          chmod +x "$binary" || true
          "$binary" --version
          "$binary" --help > /tmp/m1-317-binary-help.txt
          grep -q 'Usage:' /tmp/m1-317-binary-help.txt
          expected="$(node -p 'require("./package.json").version') (Claude Code)"
          test "$("$binary" --version)" = "$expected"
      - name: 检验正式发行完整性、原生资源、启动器以及仓库外安装
        run: |
          node --test tests/release-integrity.test.mjs
          node --test tests/distribution-isolation.test.mjs
      - name: 自包含原生执行程序走真实模型请求、配置优先级及JSON响应
        run: M1_NATIVE_BINARY_RUN=1 node --test tests/m1-startup-cli-317.test.mjs
      - name: 原版与重建版317 PTY宿主真实子进程与二进制流对照
        run: node --test tests/m1-pty-host-317.test.mjs
      - name: 317 daemon worker心跳和错误协议原版双跑
        run: node --test tests/m1-daemon-worker-317.test.mjs
      - name: 317官方与重建预加载会话接管及真实模型请求双跑
        run: node --test tests/m1-preload-317.test.mjs
      - name: 317后台预热备用进程认证、令牌回收和真实模型原版对照
        run: node --test tests/m1-bg-spare-317.test.mjs
      - name: 对比官方317和重建程序的三平台真实冷启动及帮助性能
        run: node --test tests/m1-coldstart-official-native-317.test.mjs
      - name: 测试317早期GC及allocator调优，远程运行双阶段采样
        run: node --test tests/m1-process-start-317.test.mjs
      - name: 原版317与三平台重建程序逐项对照Runner能力声明及早期启动状态
        run: node --test tests/m1-runner-declares-317.test.mjs
      - name: 对齐原版317版本与详细上游提交信息
        run: node --test tests/m1-version-verbose-317.test.mjs
      - name: 验证 317 压缩执行文件可定位平台 ripgrep
        run: node --test tests/m1-ripgrep-vendor-resolution-317.test.mjs
      - name: 验证原生程序Read Edit Write Glob Grep真实模型往返
        run: M1_NATIVE_BINARY_RUN=1 node --test tests/model-loop-local.test.mjs tests/search-loop-local.test.mjs
      - name: 验证317技能106项资源和实际Read执行
        run: M1_NATIVE_BINARY_RUN=1 node --test tests/claude-api-version-parity.test.mjs
      - name: 仓库外独立运行且无需调用Bun
        run: |
          set -euo pipefail
          isolated="$(mktemp -d)"
          cp -R dist "$isolated/release"
          cd "$isolated"
          if [ -f release/claude.exe ]; then binary=release/claude.exe; else binary=release/claude; fi
          "$binary" --version
          "$binary" auth --help | grep -q 'Usage:'
          "$binary" mcp --help | grep -q 'Usage:'
          echo "自包含二进制在源码仓库外验证通过"
