name: M4 317 项目会话发送源码与真实协议验收
on:
  push:
    branches:
      - upgrade/2.1.310-m1-evidence
    paths:
      - 'src/commands/send-to-project/**'
      - 'src/commands.ts'
      - 'tests/m4-send-to-project-317.test.ts'
      - '.github/workflows/m4-send-to-project-317.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-to-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复项目冻结的依赖
        run: |
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 项目API和用户确认前的真实协议测试
        run: bun test tests/m4-send-to-project-317.test.ts
      - name: 全仓TypeScript类型与导入
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node tools/dev/dev.mjs typecheck:all
      - name: 原始源码独立构建
        run: bun build/rebuild.mjs
