name: Android 333 专项
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '安卓端方案/**'
      - '.github/workflows/android-plan-ci.yml'
      - '.github/actions/setup-android-333/**'
  push:
    branches: [main]
    paths:
      - '安卓端方案/**'
      - '.github/workflows/android-plan-ci.yml'
      - '.github/actions/setup-android-333/**'
permissions:
  contents: read
concurrency:
  group: android333-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          set -euo pipefail
          python3 安卓端方案/tools/verify-contracts.py
          bash 安卓端方案/tools/check-toolchain.sh --self-test
  build:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-android-333
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - run: |
          set -euo pipefail
          bash 安卓端方案/tools/check-toolchain.sh
          gradle -p 安卓端方案/android-app --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deepseek-harness-android-debug
          path: 安卓端方案/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
