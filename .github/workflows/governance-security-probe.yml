name: 333 高风险依赖兼容性验证

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/governance-security-probe.yml'
      - 'tools/governance/**'

permissions:
  contents: read

jobs:
  probe:
    name: 隔离环境验证依赖升级和行为差分
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 冻结基线构建及回归
        run: npm run verify
      - name: 候选升级和安全检查
        run: |
          npm pkg set overrides.tmp=0.2.6 --prefix .rebuild/public
          npm install --prefix .rebuild/public --legacy-peer-deps --ignore-scripts --no-audit --no-fund --save-exact zod@4.6.6 sharp@0.35.5 @opentelemetry/exporter-prometheus@0.300.0
          mkdir -p .rebuild/governance
          set +e
          npm audit --prefix .rebuild/public --json > .rebuild/governance/probe-audit.json
          code=$?
          set -e
          echo "审计退出码: $code"
          node tools/governance/summarize.mjs audit .rebuild/governance/probe-audit.json .rebuild/governance/probe-audit-summary.json
      - name: 候选依赖真实编译及现有功能测试
        run: |
          bun build/rebuild.mjs
          node build/package-release.mjs
          npm run test:all
      - name: 保存实际候选结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 333-security-probe
          path: |
            .rebuild/public/package.json
            .rebuild/public/package-lock.json
            .rebuild/governance/probe-audit.json
            .rebuild/governance/probe-audit-summary.json
          retention-days: 30
          if-no-files-found: ignore
