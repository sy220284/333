name: 333 冻结依赖安全与关键接口专项验证

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/governance-security-probe.yml'
      - 'tools/governance/**'
      - 'build/public-dependencies.lock.json'
      - 'build/install-public-deps.mjs'
      - 'build/restore-dependencies.mjs'
      - 'tests/m1-prometheus-security-317.test.mjs'
      - 'tests/m1-telemetry-policy.test.mjs'
      - 'tests/m3-plugin-install-config-317.test.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: 隔离环境验证冻结依赖、安全边界和关键接口
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 校验冻结依赖并完成真实发行构建
        run: |
          node tools/dev/toolchain.mjs check
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
          bun build/rebuild.mjs
          node build/package-release.mjs
      - name: 冻结依赖风险清单与供应链审计
        run: |
          mkdir -p .rebuild/governance
          set +e
          npm audit --prefix .rebuild/public --json > .rebuild/governance/probe-audit.json
          code=$?
          set -e
          echo "审计退出码: $code"
          node tools/governance/summarize.mjs audit .rebuild/governance/probe-audit.json .rebuild/governance/probe-audit-summary.json
      - name: 插件、沙盒、图像与遥测接口专项检查
        run: |
          node --input-type=module <<'EOF'
          import * as mcpbModule from '@anthropic-ai/mcpb'
          const McpbManifestSchema = mcpbModule.v0_2?.McpbManifestSchema ?? mcpbModule.default?.v0_2?.McpbManifestSchema
          if (!McpbManifestSchema) throw Error('MCPB 清单验证 API 缺失: ' + Object.keys(mcpbModule).join(','))
          import { SandboxRuntimeConfigSchema } from '@anthropic-ai/sandbox-runtime'
          import sharp from 'sharp'
          import { PrometheusExporter } from '@opentelemetry/exporter-prometheus'
          import tmp from 'tmp'
          const invalid = McpbManifestSchema.safeParse({manifest_version:'0.1', name: ''})
          if (invalid.success || !Array.isArray(invalid.error.issues)) throw Error('MCPB 清单校验异常')
          const sandbox = SandboxRuntimeConfigSchema.safeParse({})
          if (!sandbox || typeof sandbox.success !== 'boolean') throw Error('沙盒配置检查不可用')
          const png = await sharp({ create: { width: 2, height: 2, channels: 3, background: {r: 1,g: 2,b: 3} } }).png().toBuffer()
          const decoded = await sharp(png).metadata()
          if (decoded.width !== 2 || decoded.height !== 2) throw Error('图像创建或解码失败')
          if (typeof PrometheusExporter !== 'function') throw Error('PrometheusExporter 导出缺失')
          const f = tmp.fileSync({prefix:'333-security-probe-'})
          f.removeCallback()
          console.log('[OK] 四项真实依赖接口正常')
          EOF
      - name: 高风险依赖与隐私边界针对性功能回归
        run: |
          node --test \
            tests/m1-prometheus-security-317.test.mjs \
            tests/m1-telemetry-policy.test.mjs \
            tests/m3-plugin-install-config-317.test.mjs \
            tests/m1-plugin-install-migration-317.test.mjs \
            tests/release-integrity.test.mjs \
            tests/distribution-isolation.test.mjs \
            tests/brand-runtime-cleanup.test.mjs \
            tests/cli-parity.test.mjs
      - name: 复核依赖锁未被专项验收意外修改
        run: |
          node tools/dev/toolchain.mjs check
          git diff --exit-code -- build/public-dependencies.lock.json package.json
      - name: 保存冻结依赖风险评估和接口验证证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 333-security-probe
          path: |
            .rebuild/public/package.json
            .rebuild/public/package-lock.json
            .rebuild/governance/probe-audit.json
            .rebuild/governance/probe-audit-summary.json
          retention-days: 30
          if-no-files-found: ignore
