name: M1 源码审计快照
on:
  push:
    branches:
      - upgrade/2.1.310-m1-evidence
    paths:
      - .github/workflows/m1-source-export.yml
      - tests/m1-obsolete-command-parity.test.mjs
      - tests/m1-background-agent-parity.test.mjs
      - tests/m1-background-lifecycle.test.mjs
      - 'src/cli/background/**'
      - 'src/tools/**'
      - 'src/utils/telemetry/**'
      - 'tests/m1-*.test.mjs'
      - 'build/m1-*.mjs'
      - 'docs/upgrade/m1-evidence/target-release.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 PR7 当前提交
        uses: actions/checkout@v4
      - name: 即时运行M1构建资源与终端协议单元验收
        run: |
          node --test tests/m1-vendor-packaging-317.test.mjs tests/m1-native-clipboard-317.test.mjs tests/m1-clipboard-osc-protocol-317.test.mjs
      - name: 打包源码与验收脚本
        shell: bash
        run: |
          set -euo pipefail
          paths=(src tests build docs/upgrade .github package.json)
          for extra in tsconfig.json biome.json bun.lockb; do
            if [[ -f "$extra" ]]; then paths+=("$extra"); fi
          done
          tar --exclude='**/node_modules' --exclude='**/.rebuild' -czf m1-pr7-source-snapshot.tar.gz "${paths[@]}"
          sha256sum m1-pr7-source-snapshot.tar.gz > m1-pr7-source-snapshot.sha256
          printf '%s\n' "$GITHUB_SHA" > m1-pr7-source-commit.txt
      - name: 归档源码快照供逐文件核查
        uses: actions/upload-artifact@v4
        with:
          name: m1-pr7-source-snapshot
          path: |
            m1-pr7-source-snapshot.tar.gz
            m1-pr7-source-snapshot.sha256
            m1-pr7-source-commit.txt
          if-no-files-found: error
          retention-days: 7
