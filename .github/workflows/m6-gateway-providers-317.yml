name: M6 企业模型网关、预算与遥测边界专项验收
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reusable-m6-gateway-providers-317-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gateway-contract:
    name: 企业网关身份、模型、费用与隐私协议
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复冻结的项目依赖
        run: |
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 检查模型适配、网关配置、身份认证、预算及遥测边界
        run: |
          node --experimental-strip-types --test \
            tests/m6-gateway-providers-317.test.mjs \
            tests/m6-gateway-ttfb-sse-317.test.mjs \
            tests/m6-gateway-user-id-claim-317.test.mjs \
            tests/m6-gateway-jsonb-317.test.mjs \
            tests/m6-gateway-device-rate-317.test.mjs \
            tests/m6-gateway-admin-317.test.mjs \
            tests/m6-gateway-spend-integration-317.test.mjs \
            tests/m6-gateway-cri-317.test.mjs \
            tests/m6-gateway-telemetry-policy-317.test.mjs
      - name: 验证真实 Bun 网关服务、设备授权与 SSE
        run: bun test tests/m6-gateway-runtime-317.test.mjs tests/m6-gateway-device-317.test.mjs

  gateway-postgres:
    name: PostgreSQL 真实设备授权、令牌和审计事务
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GATEWAY_TEST_POSTGRES_URL: postgres://gateway_test:gateway_test@127.0.0.1:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复冻结的项目依赖
        run: |
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 验证真实 PostgreSQL 会话、凭证轮换与授权撤销
        run: bun test tests/m6-gateway-postgres-317.test.mjs
