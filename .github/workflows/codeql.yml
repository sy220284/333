name: 333 代码安全静态扫描

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'build/**'
      - 'tools/dev/**'
      - 'tests/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'build/**'
      - 'tools/dev/**'
      - 'tests/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: JavaScript / TypeScript 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/dev-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
