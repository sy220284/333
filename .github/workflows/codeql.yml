name: 333 代码安全静态扫描

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'build/**'
      - 'tools/dev/**'
      - 'tests/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'build/**'
      - 'tools/dev/**'
      - 'tests/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'

permissions:
  actions: read
  contents: read
  security-events: write
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  codeql:
    name: JavaScript / TypeScript 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/dev-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
      - name: 读取 SARIF 并输出实际发现的文件与行号
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const candidates = [
            path.resolve('..', 'results', 'javascript.sarif'),
            path.resolve('results', 'javascript.sarif'),
          ];
          const source = candidates.find(file => fs.existsSync(file));
          if (!source) throw new Error('未找到 CodeQL SARIF 结果文件');
          const data = JSON.parse(fs.readFileSync(source, 'utf8'));
          const issues = data.runs.flatMap(run => (run.results || []).map(item => {
            const location = item.locations?.[0]?.physicalLocation;
            return {
              rule: item.ruleId,
              severity: item.level,
              file: location?.artifactLocation?.uri,
              line: location?.region?.startLine,
              message: item.message?.text,
            };
          }));
          console.log(JSON.stringify({ total: issues.length, items: issues.slice(0, 300) }, null, 2));
          fs.copyFileSync(source, path.join(process.env.RUNNER_TEMP, '333-codeql.sarif'));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/333-codeql.sarif
          if-no-files-found: warn
      - name: 记录 PR CodeQL 告警规则和精确位置
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            check_id="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100" \
              --jq '.check_runs | map(select(.name == "CodeQL" and .status == "completed")) | last | .id // empty')"
            if [[ -n "$check_id" ]]; then break; fi
            sleep 2
          done
          if [[ -z "${check_id:-}" ]]; then
            echo "CodeQL 完成记录未找到，无法获取告警明细" >&2
            exit 1
          fi
          echo "CodeQL check run: $check_id"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}/annotations?per_page=100" \
            --jq '.[] | [.annotation_level, .path, (.start_line|tostring), .title, .message] | @tsv'
