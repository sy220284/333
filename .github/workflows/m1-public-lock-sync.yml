name: 333 冻结依赖锁与发行基准一致性
on:
  pull_request:
    branches: [main]
    paths:
      - 'build/install-public-deps.mjs'
      - 'build/public-dependencies.lock.json'
      - 'build/check-upgrade-protection.mjs'
      - 'package.json'
      - 'docs/upgrade/pr13-upgrade-protection-baseline.json'
      - 'tools/dev/toolchain.lock.json'
      - '.github/workflows/m1-public-lock-sync.yml'
  push:
    branches: [main]
    paths:
      - 'build/install-public-deps.mjs'
      - 'build/public-dependencies.lock.json'
      - 'build/check-upgrade-protection.mjs'
      - 'package.json'
      - 'docs/upgrade/pr13-upgrade-protection-baseline.json'
      - 'tools/dev/toolchain.lock.json'
      - '.github/workflows/m1-public-lock-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 333-release-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sync:
    name: 冻结依赖和升级保护只读校验
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 读取权威工具链版本
        run: node tools/dev/toolchain.mjs gha-env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.TOOLCHAIN_NODE_VERSION }}
      - name: 锁定依赖、发行版本与历史基准校验
        run: node tools/dev/toolchain.mjs check
      - name: 负向防回退与工具链清单回归
        run: node --test tests/upgrade-protection.test.mjs tests/toolchain-manifest.test.mjs
