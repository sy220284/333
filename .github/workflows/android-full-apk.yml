name: 333 Android 完整离线 APK 集成构建
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-full-apk.yml'
      - '安卓端方案/android-app/**'
      - '安卓端方案/tools/runtime/**'
      - '安卓端方案/tools/runtime/test_host_archive.py'
      - '安卓端方案/tools/runtime/verify-host-payload.py'
      - '安卓端方案/tools/runtime/prepare-termux-node.sh'
      - '安卓端方案/tools/runtime/verify-node-payload.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-full-apk.yml'
      - '安卓端方案/android-app/**'
      - '安卓端方案/tools/runtime/**'

permissions:
  contents: read

concurrency:
  group: android333-complete-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: 构建官方 Harness Host 的离线依赖闭包
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: 安装锁定依赖并构建官方发布物
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build:artifacts --profile official
          pnpm --filter @deepseek-ai/dsh deploy --prod --legacy "$RUNNER_TEMP/dsh-android-deploy"
          python3 安卓端方案/tools/runtime/relocate-external-links.py "$RUNNER_TEMP/dsh-android-deploy" "$GITHUB_WORKSPACE"
      - name: 验证完整 Host 发布目录并生成归档
        run: |
          set -euo pipefail
          python3 -m unittest discover -s 安卓端方案/tools/runtime -p 'test_host*.py' -v
          python3 -m unittest discover -s 安卓端方案/tools/runtime -p 'test_relocate*.py' -v
          python3 安卓端方案/tools/runtime/package-host.py "$RUNNER_TEMP/dsh-android-deploy" "$RUNNER_TEMP/dsh-android-host"
          python3 安卓端方案/tools/runtime/verify-host-payload.py "$RUNNER_TEMP/dsh-android-host" --source "$RUNNER_TEMP/dsh-android-deploy"
          test -f "$RUNNER_TEMP/dsh-android-host/assets/runtime/host/package.zip"
          du -h "$RUNNER_TEMP/dsh-android-host/assets/runtime/host/package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 333-offline-host-${{ github.sha }}
          path: ${{ runner.temp }}/dsh-android-host/assets/
          retention-days: 14
          if-no-files-found: error

  node-arm64:
    name: 签名校验并构建 Android arm64 Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 生成完整签名验证的 Node 运行时
        env:
          DSH_RUNTIME_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          python3 -m unittest discover -s 安卓端方案/tools/runtime -p 'test_*.py' -v
          bash 安卓端方案/tools/runtime/prepare-termux-node.sh "$RUNNER_TEMP/node333"
          python3 安卓端方案/tools/runtime/verify-node-payload.py "$RUNNER_TEMP/node333" --abi arm64-v8a
          python3 安卓端方案/tools/runtime/verify-node-payload.py "$RUNNER_TEMP/node333" --abi arm64-v8a --check-only
      - uses: actions/upload-artifact@v4
        with:
          name: 333-verified-node26-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/node333/
          retention-days: 14
          if-no-files-found: error

  complete-apk:
    name: 完整 APK 组装与内容验收
    needs: [host, node-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          name: 333-offline-host-${{ github.sha }}
          path: ${{ runner.temp }}/host333/assets
      - uses: actions/download-artifact@v4
        with:
          name: 333-verified-node26-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/node333
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-android-333
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: 重验 Node/Host 资源并生成完整 APK
        env:
          DSH333_NODE_RUNTIME_DIR: ${{ runner.temp }}/node333
          DSH333_HOST_BUNDLE_DIR: ${{ runner.temp }}/host333
        run: |
          set -euo pipefail
          python3 安卓端方案/tools/runtime/verify-node-payload.py "$DSH333_NODE_RUNTIME_DIR" --abi arm64-v8a --check-only
          python3 安卓端方案/tools/runtime/verify-host-payload.py "$DSH333_HOST_BUNDLE_DIR"
          gradle -p 安卓端方案/android-app --no-daemon :app:assembleDebug :app:testDebugUnitTest
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apks = list(Path('安卓端方案/android-app/app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks) == 1, apks
          apk = apks[0]
          with zipfile.ZipFile(apk) as z:
              node = 'lib/arm64-v8a/libdsh_node.so'
              host = 'assets/runtime/host/package.zip'
              manifest = 'assets/runtime/dsh-host-manifest.json'
              assert all(n in z.namelist() for n in (node, host, manifest))
              payload = json.loads(z.read(manifest))
              assert payload['format'] == '333-host-v1'
              digest = hashlib.sha256()
              with z.open(host) as handle:
                  while piece := handle.read(1024 * 1024):
                      digest.update(piece)
              assert digest.hexdigest() == payload['sha256']
              assert z.getinfo(host).file_size == payload['bytes']
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent / 'SHA256SUMS.txt').write_text(f'{sha}  {apk.name}\n')
          print('APK assembled with Node and Host payload', apk, sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 333-android-full-debug-apk-${{ github.sha }}
          path: |
            安卓端方案/android-app/app/build/outputs/apk/debug/*.apk
            安卓端方案/android-app/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
