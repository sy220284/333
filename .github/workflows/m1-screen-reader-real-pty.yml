name: M1 新桌面工作台无障碍与无界面协议验收

on:
  push:
    branches: [upgrade/latest-stable-deps-20261105]
    paths:
      - 'desktop/src/**'
      - 'desktop/tests/**'
      - 'desktop/electron/**'
      - 'src/entrypoints/cli.tsx'
      - 'src/entrypoints/startupRouting317.ts'
      - 'src/cli/desktop/launch.ts'
      - 'tests/desktop-tui-retirement.test.mjs'
      - '.github/workflows/m1-screen-reader-real-pty.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-desktop-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-accessibility:
    name: 新桌面无障碍、交互入口与 CLI 协议验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - name: 验证新 UI 无障碍与旧终端实际移除
        run: node --test desktop/tests/desktop-accessibility.test.mjs tests/desktop-tui-retirement.test.mjs
      - name: 恢复主项目协议与原生依赖
        run: |
          node build/verify-bundled-assets.mjs
          node build/restore-claude-api.mjs --verify
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 安装桌面冻结依赖
        run: cd desktop && npm install --no-audit --no-fund
      - name: 检查桌面类型与实际打包
        run: |
          npm --prefix desktop run typecheck
          npm --prefix desktop run build
      - name: 核对新 UI 页面、动效、权限与会话入口
        run: npm --prefix desktop test
