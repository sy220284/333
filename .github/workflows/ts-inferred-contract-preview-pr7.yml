name: PR7真实TypeScript签名补全预审
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/ts-inferred-contract-preview-pr7.yml'
      - 'tools/dev/annotate-inferred-ts-contracts.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr7-inferred-signatures-${{ github.sha }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装冻结TS编译器与项目依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 确认当前代码通过TypeScript检查
        run: node tools/dev/dev.mjs typecheck:all
      - name: 以真实TypeScript推断预审导出函数缺失类型
        run: node tools/dev/annotate-inferred-ts-contracts.mjs
      - name: 上传逐文件可安全补齐及需人工移植清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-contract-preview
          path: .rebuild/governance/inferred-ts-contracts.json
          retention-days: 30
          if-no-files-found: warn
