name: 新桌面会话反馈及流式协议校验
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-session-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop-session-feedback:
    name: 工作台真实会话状态、流式输出与提示配置
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复本地协议与设置测试依赖
        run: |
          node build/verify-bundled-assets.mjs
          node build/restore-claude-api.mjs --verify
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 会话提示配置、动态状态与流式事件测试
        run: |
          node --test tests/m1-spinner-tips.test.mjs tests/m1-custom-spinner-tips.test.mjs
          node --test tests/m1-spinner-settings-integration.test.mjs
          node --experimental-strip-types --test tests/m1-spinner-animation-status.test.mjs tests/m1-thinking-duration-label.test.mjs
          node --test desktop/tests/desktop-session-feedback.test.mjs
      - name: 验证新 UI 实际主题与桌面打包
        run: |
          cd desktop && npm install --no-audit --no-fund
          npm --prefix desktop run typecheck
          npm --prefix desktop test
          npm --prefix desktop run build
