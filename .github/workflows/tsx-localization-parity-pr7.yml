name: PR7 恢复TSX中文界面保真校验
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/tsx-localization-parity-pr7.yml'
      - 'tools/dev/audit-restored-ui-localization.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localized-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 全量核对199个恢复文件的中文文案保留情况
        run: node tools/dev/audit-restored-ui-localization.mjs
      - name: 保存中文界面逐文件审计清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-tsx-ui-localization-evidence
          path: .rebuild/governance/tsx-localization-regression.json
          retention-days: 30
          if-no-files-found: warn
