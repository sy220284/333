name: 恢复原始 Claude API 技能资料
on:
  push:
    branches: [recovery/claude-api-assets]
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 从 2.1.88 原始可执行文件恢复并校验 26 份资料
        run: node build/restore-claude-api.mjs
      - name: 提交已经通过 SHA-256 校验的原始资料
        run: |
          git add src/skills/bundled/claude-api/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "恢复 26 份原版 Claude API 技能文档"
            git push origin HEAD:recovery/claude-api-assets
          fi
      - name: 重新验证恢复后的已入库文件
        run: node build/restore-claude-api.mjs --verify
