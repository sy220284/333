name: 317插件评测上下文源码与实际脚本验收
on:
  push:
    branches:
      - upgrade/2.1.310-m1-evidence
    paths:
      - 'src/cli/handlers/pluginEvalCatalog317.ts'
      - 'src/cli/handlers/pluginEvalEngine317.ts'
      - 'src/cli/handlers/pluginEvalEntry317.ts'
      - 'src/cli/handlers/pluginEvalModel317.ts'
      - 'src/cli/handlers/pluginEvalWorkspace317.ts'
      - 'tests/m3-plugin-eval-context-317.test.mjs'
      - '.github/workflows/m3-plugin-eval-context-317.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验新版上下文、真实脚本及模型参数传递
        run: node --experimental-strip-types --test tests/m3-plugin-eval-context-317.test.mjs tests/m3-plugin-eval-engine-317.test.mjs
