name: M1 317 三平台发行启动与失败恢复验收

on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/m1-317-launcher-lifecycle.yml'
      - 'build/release-launcher.cjs'
      - 'build/package-release.mjs'
      - 'tests/m1-launcher-lifecycle-317.test.mjs'
      - 'tests/m1-vendor-packaging-317.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-317-launcher-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  launcher:
    name: 验证发行启动器与打包事务 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 测试官方317发行资源打包、故障回滚与启动器退出生命周期
        run: node --test tests/m1-launcher-lifecycle-317.test.mjs tests/m1-vendor-packaging-317.test.mjs
      - name: 检查源文件与测试执行未修改仓库
        shell: bash
        run: test -z "$(git status --porcelain)"
