name: 2.1.317 原版模块整包移植与真实启动验证

on:
  push:
    branches:
      - upgrade/2.1.310-m1-evidence
    paths:
      - build/import-official-317.py
      - .github/workflows/import-official-317.yml
      - tests/official-317-port-roundtrip.py
      - tests/official-317-tool-matrix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出 PR 7 源码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 安装 Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 安装 zstd
        run: |
          if ! command -v zstd >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y zstd; fi

      - name: 下载并锁定官方 317 Linux x64 原始包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rebuild/official317
          curl --fail --location --retry 3 --silent --show-error             'https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-2.1.317.tgz'             -o .rebuild/official317/official.tgz
          tar -xzf .rebuild/official317/official.tgz -C .rebuild/official317
          test -f .rebuild/official317/package/claude
          chmod +x .rebuild/official317/package/claude
          .rebuild/official317/package/claude --version

      - name: 从 ELF 一次性移植全部 2924 模块与资源
        shell: bash
        run: |
          set -euo pipefail
          python3 build/import-official-317.py --binary .rebuild/official317/package/claude --out .rebuild/official317/staged
          if test -d vendor/claude-code-2.1.317; then
            cp -a .rebuild/official317/staged/. vendor/claude-code-2.1.317/
          else
            mv .rebuild/official317/staged vendor/claude-code-2.1.317
          fi
          python3 build/import-official-317.py --out vendor/claude-code-2.1.317 --verify-only

      - name: 检查完整模块索引与资源数据
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('vendor/claude-code-2.1.317/manifest.json')
          data = json.loads(p.read_text())
          assert data['module_count'] == 2924
          assert data['kinds'] == {'js':2691,'file':133,'text':98,'napi':2}
          assert sum('decoded_sha256' in i for i in data['files']) == 128
          assert len({i['path'] for i in data['files']}) == 2924
          print('ELF 模块和资源索引精确通过')
          PY

      - name: 运行提取出的完整 JS 引擎并对照官方 CLI
        shell: bash
        run: |
          set -euo pipefail
          bun vendor/claude-code-2.1.317/modules/cli.mjs --version > .rebuild/official317/ported-version.txt
          .rebuild/official317/package/claude --version > .rebuild/official317/native-version.txt
          diff -u .rebuild/official317/native-version.txt .rebuild/official317/ported-version.txt
          timeout 45s bun vendor/claude-code-2.1.317/modules/cli.mjs --help > .rebuild/official317/ported-help.txt
          timeout 45s .rebuild/official317/package/claude --help > .rebuild/official317/native-help.txt
          diff -u .rebuild/official317/native-help.txt .rebuild/official317/ported-help.txt

      - name: 与官方317模拟Read工具调用真实往返对照
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/official-317-port-roundtrip.py --official .rebuild/official317/package/claude --ported vendor/claude-code-2.1.317/modules/cli.mjs

      - name: 官方317与整包移植版Read Write Edit Bash完整工具链对照
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/official-317-tool-matrix.py --official .rebuild/official317/package/claude --ported vendor/claude-code-2.1.317/modules/cli.mjs

      - name: 提交已通过真实 CLI 测试的 317 整包源码
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor/claude-code-2.1.317
          if ! git diff --cached --quiet; then
            git commit -m "批量导入官方317模块资源并通过CLI真实运行对照"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
