name: M1 317 六架构官方原生实机运行与字节验收

on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/m1-317-six-platform-runtime.yml'
      - 'tests/m1-six-host-native-audio-317.test.mjs'
      - 'build/official-native-audio-317.json'
      - 'vendor/audio-capture/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-317-six-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-runtime:
    name: 六架构官方317实机原生加载 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-2025 }
          - { target: win32-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      M1_TARGET_PLATFORM: ${{ matrix.target }}
    steps:
      - name: Windows检出前启用Git长路径
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 当前真实CPU架构与官方317原生音频NAPI校验
        run: node --test tests/m1-six-host-native-audio-317.test.mjs
      - name: 获取对应架构官方317原生程序和签名清单
        run: |
          set -euo pipefail
          base='https://downloads.claude.ai/claude-code-releases/2.1.317'
          target="$M1_TARGET_PLATFORM"
          output="$RUNNER_TEMP/m1-original-317"
          mkdir -p "$output"
          name=claude
          if [[ "$target" == win32-* ]]; then name=claude.exe; fi
          curl --fail --location --show-error --silent --retry-all-errors --retry 4 \
            "$base/manifest.json" -o "$output/manifest.json"
          curl --fail --location --show-error --silent --retry-all-errors --retry 4 \
            "$base/$target/$name" -o "$output/$name"
          if [[ "$target" != win32-* ]]; then chmod +x "$output/$name"; fi
      - name: 实机启动对应官方317程序并核对平台完整SHA和版本
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const target = process.env.M1_TARGET_PLATFORM
          const root = join(process.env.RUNNER_TEMP, 'm1-original-317')
          const manifest = JSON.parse(readFileSync(join(root, 'manifest.json'), 'utf8'))
          const checksum = manifest.platforms?.[target]?.checksum?.toLowerCase()
          assert.match(checksum, /^[a-f0-9]{64}$/, 'Official manifest lacks checksum')
          const name = target.startsWith('win32-') ? 'claude.exe' : 'claude'
          const executable = join(root, name)
          const bytes = readFileSync(executable)
          const actual = createHash('sha256').update(bytes).digest('hex')
          assert.equal(actual, checksum, 'Original 317 executable differs from official checksum')
          const result = spawnSync(executable, ['--version', '--verbose'], {
            encoding: 'utf8', timeout: 16000,
            env: { ...process.env, DISABLE_AUTOUPDATER: '1',
              CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1' },
          })
          assert.ifError(result.error)
          assert.equal(result.status, 0, result.stderr)
          assert.match(result.stdout, /^2\.1\.317 \(Claude Code\)/)
          assert.match(result.stdout, /Commit: 3d3e7cb16b5577dccaee9520c8dc1189d02d61b7/)
          const evidence = {target, nodeArch:process.arch, sha256:actual,bytes:bytes.length,
            version:result.stdout.trim(),official:true}
          console.log(JSON.stringify(evidence))
          writeFileSync(join(root, 'evidence.json'), JSON.stringify(evidence,null,2))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-317-six-native-${{ matrix.target }}
          path: ${{ runner.temp }}/m1-original-317/evidence.json
          retention-days: 60
          if-no-files-found: warn
