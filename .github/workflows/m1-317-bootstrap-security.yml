name: M1 317 启动生命周期和令牌保护验收

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reusable-m1-317-bootstrap-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  startup-security:
    name: 审核317启动安全和JIT策略 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Windows检出完整源码前启用Git长路径
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 启动早期JIT策略、远程令牌描述符、Linux内核转储权限验收
        run: node --test tests/m1-jit-startup-317.test.mjs tests/m1-relay-token-guard-317.test.mjs

      - name: 验证后台守护进程重连边界和恢复参数一致性
        run: bun test tests/m1-socket-ownership-317.test.ts tests/m1-background-resume-flags-317.test.ts
