name: M1 官方317 Linux原生资源运行验收
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/m1-317-native-clipboard.yml'
      - 'build/official-native-317.json'
      - 'build/sync-official-native-from-binary.mjs'
      - 'src/ink/termio/osc.ts'
      - 'src/ink/termio/clipboardNative317.mjs'
      - 'src/ink/termio/clipboardOsc317.mjs'
      - 'tests/m1-native-clipboard*.test.mjs'
      - 'tests/m1-clipboard-osc-protocol-317.test.mjs'
      - 'tests/m1-native-audio-317.test.mjs'
  workflow_dispatch:
concurrency:
  group: m1-317-native-clipboard-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 检查官方317原生模块目录与目标二进制完整性
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry-all-errors --retry 4 \
            'https://downloads.claude.ai/claude-code-releases/2.1.317/linux-x64/claude' \
            -o "$RUNNER_TEMP/claude-2.1.317-linux-x64"
          echo "eb224419e344575faa4a1f39b290b649425a10cd5ee2ef1d003480cd9ae57eb0  $RUNNER_TEMP/claude-2.1.317-linux-x64" | sha256sum --check
          node build/sync-official-native-from-binary.mjs \
            --binary "$RUNNER_TEMP/claude-2.1.317-linux-x64" --vendor-root vendor --sync
          node build/sync-official-native-from-binary.mjs \
            --binary "$RUNNER_TEMP/claude-2.1.317-linux-x64" --vendor-root vendor
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 校验Bun独立打包后的原生模块可装载与缺失处理
        run: node --test tests/m1-native-clipboard-bundle-317.test.mjs
      - name: 立即验证本地和远程终端的剪贴板协议
        run: |
          node --test tests/m1-native-clipboard-317.test.mjs \
            tests/m1-clipboard-osc-protocol-317.test.mjs
      - name: 验证官方317音频原生模块空闲状态和幂等释放
        run: node --test tests/m1-native-audio-317.test.mjs
      - name: 使用Xvfb确认Unicode原生剪贴板实际可读写
        shell: bash
        run: |
          set -euo pipefail
          command -v Xvfb
          command -v xvfb-run
          xvfb-run -a node --test tests/m1-native-clipboard-xvfb-317.test.mjs
