name: M1 317 六架构从源码编译与独立程序真实运行验收

on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/m1-317-six-host-standalone.yml'
      - 'build/rebuild.mjs'
      - 'build/compile-standalone.mjs'
      - 'build/package-release.mjs'
      - 'src/entrypoints/cli.tsx'
      - 'src/main.tsx'
      - 'src/cli/print.ts'
      - 'tests/cli-parity.test.mjs'
      - 'tests/fixtures/claude-2.1.317-official-cli-help.json'
      - 'src/bootstrap/**'
      - 'src/entrypoints/runnerDeclaration317.ts'
      - 'src/entrypoints/startupRouting317.ts'
      - 'src/utils/cliArgv317.ts'
      - 'src/cli/background/**'
      - 'src/bridge/sessionRunner.ts'
      - 'src/utils/sessionStorage.ts'
      - 'src/utils/sessionStoragePortable.ts'
      - 'src/utils/sessionTranscriptPathsV5.ts'
      - 'src/utils/sessionHydrationCommit317.ts'
      - 'src/utils/resumePreparationV5.ts'
      - 'src/tasks/LocalWorkflowTask/workflowStoragePaths.ts'
      - 'tests/m1-bg-spare-317.test.mjs'
      - 'tests/m1-daemon-worker-317.test.mjs'
      - 'tests/m1-preload-317.test.mjs'
      - 'tests/m1-pty-host-317.test.mjs'
      - 'tests/m1-pty-recording-317.test.mjs'
      - 'tests/m1-background-lifecycle.test.mjs'
      - 'tests/m1-runner-declares-317.test.mjs'
      - 'tests/m1-startup-socket-ownership-317.test.mjs'
      - 'tests/m1-fast-path-settings-317.test.mjs'
      - 'tests/m1-startup-argv-317.test.mjs'
      - 'tests/m1-claim-rebind-317.test.mjs'
      - 'tests/m4-session-transcript-paths-v5.test.mjs'
      - 'tests/m4-resume-preparation-v5.test.mjs'
      - 'tests/m4-session-storage-v5-integration.test.ts'
      - 'build/public-dependencies.lock.json'
      - 'tests/m1-six-host-native-audio-317.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-317-six-standalone-${{ github.sha }}
  cancel-in-progress: false

jobs:
  standalone:
    name: PR7源码六架构真实编译与发行 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-2025 }
          - { target: win32-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      M1_TARGET_PLATFORM: ${{ matrix.target }}
    steps:
      - name: Windows检出前启用长路径保留完整依赖源码
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 真实宿主原生模块完整字节与接口
        run: node --test tests/m1-six-host-native-audio-317.test.mjs
      - name: 完整源码依赖与官方资源原样检查
        run: |
          set -euo pipefail
          node build/verify-bundled-assets.mjs
          node build/restore-claude-api.mjs --verify
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 真实源码重建2.1.317程序
        run: bun build/rebuild.mjs
      - name: 六架构独立编译二进制与发行封装
        run: |
          set -euo pipefail
          node build/compile-standalone.mjs
          node build/package-release.mjs
      - name: 自包含独立程序版本、帮助与宿主架构
        run: |
          set -euo pipefail
          binary=dist/claude
          if [[ "$M1_TARGET_PLATFORM" == win32-* ]]; then binary=dist/claude.exe; fi
          "$binary" --version --verbose | tee "$RUNNER_TEMP/m1-317-six-version.txt"
          "$binary" --help > "$RUNNER_TEMP/m1-317-six-help.txt"
          grep -F '2.1.317 (Claude Code)' "$RUNNER_TEMP/m1-317-six-version.txt"
          grep -F 'Usage:' "$RUNNER_TEMP/m1-317-six-help.txt"
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform+"-"+process.arch,process.env.M1_TARGET_PLATFORM)'
      - name: 发行业务完整性与仓库外启动双重验证
        run: |
          node --test tests/release-integrity.test.mjs
          node --test tests/distribution-isolation.test.mjs
      - name: 六架构原生独立程序真实模型SSE、工具与设置端到端
        run: M1_NATIVE_BINARY_RUN=1 node --test tests/m1-startup-cli-317.test.mjs
      - name: Runner、后台宿主、预热接管与 Storage V5 六架构端到端联动
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/m1-bg-spare-317.test.mjs tests/m1-daemon-worker-317.test.mjs tests/m1-preload-317.test.mjs tests/m1-runner-declares-317.test.mjs tests/m1-startup-socket-ownership-317.test.mjs
          bun test tests/m1-claim-rebind-317.test.mjs
          node --test tests/m4-session-transcript-paths-v5.test.mjs tests/m4-resume-preparation-v5.test.mjs
          bun test tests/m4-session-storage-v5-integration.test.ts
          # Verify the actual PTY transport, exec recording and background
          # supervisor dispatch/restore chain, not just a warm-spare handshake.
          node --test --test-concurrency=1 tests/m1-pty-host-317.test.mjs tests/m1-pty-recording-317.test.mjs tests/m1-background-lifecycle.test.mjs
          node --test tests/m1-fast-path-settings-317.test.mjs tests/m1-startup-argv-317.test.mjs
      - name: 317官方CLI参数与隐藏权限回调行为差分
        run: node --test tests/cli-parity.test.mjs
      - name: 发行元数据记录至构建证据
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync,writeFileSync,statSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'
          const target=process.env.M1_TARGET_PLATFORM
          const binary=join('dist',target.startsWith('win32-')?'claude.exe':'claude')
          const bytes=readFileSync(binary)
          const evidence={target,source:'PR7 TypeScript',release:'2.1.317',
            compiled:true,executableSize:statSync(binary).size,
            sha256:createHash('sha256').update(bytes).digest('hex'),
            version:readFileSync(join(process.env.RUNNER_TEMP,'m1-317-six-version.txt'),'utf8').trim()}
          writeFileSync(join(process.env.RUNNER_TEMP,'m1-317-six-host.json'),JSON.stringify(evidence,null,2))
          console.log(JSON.stringify(evidence))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-317-standalone-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/m1-317-six-host.json
            ${{ runner.temp }}/m1-317-six-version.txt
          retention-days: 60
          if-no-files-found: warn
