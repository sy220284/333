name: PR7 已验收原始TSX源码快速恢复
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/restore-inline-ts-verified-pr7.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pr7-original-tsx-verified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 获取上一轮真实编译通过的199个原始源码路径
        uses: actions/download-artifact@v4
        with:
          name: recovered-original-typescript-batch
          run-id: 41944872230
          github-token: ${{ github.token }}
          path: .rebuild/verified
      - name: 安装冻结的TS编译器及源码依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 复核当前分支源码映射候选清单
        run: node tools/dev/restore-inline-ts-source.mjs
      - name: 复用已验证恢复记录并保护恢复后修改的文件
        run: node tools/dev/restore-inline-ts-from-prior.mjs
      - name: 内容审计及严格TypeScript编译
        run: |
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
      - name: 真正执行产品构建与语言格式回归
        run: |
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs
          node --test tests/welcome-layout.test.mjs tests/clawd-animations.test.mjs
          git diff --check
      - name: 安全同步最新分支并提交已验证源文件
        shell: bash
        run: |
          set -euo pipefail
          git add src native
          if git diff --cached --quiet; then
            echo '无需再次覆盖：全部安全候选已在最新分支中'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '恢复已验收原始TypeScript与TSX组件并验证现有功能'
          for attempt in 1 2 3 4 5; do
            git fetch origin upgrade/2.1.310-m1-evidence
            git rebase origin/upgrade/2.1.310-m1-evidence
            node tools/dev/dev.mjs typecheck:all
            node --test tests/language-file-contract.test.mjs
            if git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence; then
              echo '已提交并验证最新PR7源码'
              exit 0
            fi
            echo "分支并发更新，重试安全提交 $attempt/5"
          done
          echo '五次并发提交重试仍未完成，保留证据并失败退出'
          exit 1
      - name: 上传逐文件恢复与异常证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-restored-original-tsx-evidence
          path: |
            .rebuild/governance/inline-ts-source-recovery.json
            .rebuild/governance/inline-ts-current-batch.json
            .rebuild/governance/type-migration-report.json
          retention-days: 30
          if-no-files-found: warn
