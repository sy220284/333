name: 导入 DeepSeek Harness 官方基线
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取官方基线提交
        env:
          UPSTREAM_SHA: e8f7b93a344964de3dca1ace9e72b6e4d6de87cb
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C upstream fetch --depth=1 origin "$UPSTREAM_SHA"
          test "$(git -C upstream rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git -C upstream cat-file -e "$UPSTREAM_SHA^{tree}"
          echo "上游提交: $UPSTREAM_SHA"
          echo "上游文件树: $(git -C upstream rev-parse "$UPSTREAM_SHA^{tree}")"

      - name: 原样导入文件树并推送 main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: e8f7b93a344964de3dca1ace9e72b6e4d6de87cb
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_tree="$(git -C upstream rev-parse "$UPSTREAM_SHA^{tree}")"
          new_commit="$(GIT_AUTHOR_NAME='Upstream Baseline Import' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_NAME='Upstream Baseline Import' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' git -C upstream commit-tree "$source_tree" -m "导入 DeepSeek Harness 官方主线源码" -m "官方仓库: https://github.com/deepseek-ai/deepseek-harness" -m "原始提交: $UPSTREAM_SHA" -m "原始文件树: $source_tree")"
          test "$(git -C upstream rev-parse "$new_commit^{tree}")" = "$source_tree"
          git -C upstream remote add target "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C upstream push --force-with-lease="refs/heads/main:${EXPECTED_MAIN_SHA}" target "$new_commit:refs/heads/main"
          echo "导入提交: $new_commit"
          echo "导入文件树: $source_tree"
