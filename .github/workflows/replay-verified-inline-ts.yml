name: 已验收原始TSX源码批量回写
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/replay-verified-inline-ts.yml'
      - 'tools/dev/apply-verified-inline-ts.mjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-tsx-replay
  cancel-in-progress: false
jobs:
  restore:
    name: 复用199个已验收源码并提交到PR7
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 准备已有验收环境
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 下载不可变的199文件验收报告
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .rebuild/governance
          gh run download 41944872230 --repo ${{ github.repository }} --name recovered-original-typescript-batch --dir .rebuild/governance
          test -s .rebuild/governance/inline-ts-compatible-report.json
      - name: 仅恢复源文件未被其他提交改动的已验收TSX
        run: node tools/dev/apply-verified-inline-ts.mjs .rebuild/governance/inline-ts-compatible-report.json
      - name: 全仓类型检查与严格迁移审计
        run: |
          node tools/dev/dev.mjs typecheck:all
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
      - name: 从源码进行完整生产构建与UI语言格式回归
        run: |
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs tests/welcome-layout.test.mjs tests/clawd-animations.test.mjs tests/clawd-animation-selection.test.mjs tests/chinese-only-ui.test.mjs
          git diff --check
      - name: 提交已验证源码并与PR7最新代码同步
        shell: bash
        run: |
          set -euo pipefail
          git add -u src
          if git diff --cached --quiet; then
            echo '无需再次提交，原始源码已经在分支内'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '恢复已验证的原始TypeScript与TSX组件，解决批量回写卡点'
          for attempt in 1 2 3 4 5; do
            git fetch origin upgrade/2.1.310-m1-evidence
            git rebase origin/upgrade/2.1.310-m1-evidence
            if git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence; then
              echo '源码已安全写入PR7'
              exit 0
            fi
            echo "第 ${attempt} 次推送存在并发提交，将同步最新分支后重试"
          done
          echo '发生持续并发推送冲突，回写未完成'
          exit 1
      - name: 保存逐文件回写与剩余冲突清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-replay-${{ github.sha }}
          path: |
            .rebuild/governance/inline-ts-replay-report.json
            .rebuild/governance/type-migration-report.json
            .rebuild/governance/inline-ts-compatible-report.json
          if-no-files-found: warn
          retention-days: 30
