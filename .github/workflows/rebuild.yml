name: 源码独立重建验证
on:
  push:
    branches: [rebuild/bun-from-src]
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: |
            ~/.npm
            .rebuild/public
          key: rebuild-deps-${{ runner.os }}-${{ hashFiles('build/install-public-deps.mjs', 'build/public-dependencies.lock.json') }}
      - name: 恢复并校验原版内嵌资源
        run: node build/restore-bundled-assets.mjs
      - name: 将恢复资源保存到源代码
        run: |
          git add src/skills/bundled/verify src/utils/ultraplan/prompt.txt src/utils/permissions/yolo-classifier-prompts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "恢复 2.1.88 原始技能与规划提示词资源"
            git push origin HEAD:rebuild/bun-from-src
          fi
      - name: 从源码映射恢复精确依赖快照
        run: node build/restore-dependencies.mjs
      - name: 安装缺失的完整第三方依赖
        run: node build/install-public-deps.mjs
      - name: 提交依赖版本锁定文件
        run: |
          git add build/public-dependencies.lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "固定完整公共依赖版本与完整性校验"
            git push origin HEAD:rebuild/bun-from-src
          fi
      - uses: actions/cache/save@v4
        if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.npm
            .rebuild/public
          key: rebuild-deps-${{ runner.os }}-${{ hashFiles('build/install-public-deps.mjs', 'build/public-dependencies.lock.json') }}
      - name: 仅从 src 源码构建
        run: bun build/rebuild.mjs
      - name: 新构建版本和基础交互验收
        run: |
          set -euo pipefail
          test -f dist/cli.js
          bun dist/cli.js --version | grep -F '2.1.88'
          bun dist/cli.js --help | grep -F -- '--print'
      - name: 打包独立发行程序和平台资源
        run: node build/package-release.mjs
      - name: 校验发行文件完整性与启动器
        run: node --test tests/release-integrity.test.mjs
      - name: 与原版 CLI 参数和命令差分验收
        run: node --test tests/cli-parity.test.mjs
      - name: 保存独立重建版发行产物
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-claude-2.1.88-linux
          path: dist/
          retention-days: 14
          if-no-files-found: error

