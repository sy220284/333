name: 源码独立重建验证
on:
  push:
    branches: [main, rebuild/bun-from-src, upgrade/2.1.310-m1-m10-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Windows 提前启用 Git 长路径（完整保留嵌套依赖源码）
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: |
            ~/.npm
            .rebuild/public
          key: rebuild-deps-${{ runner.os }}-${{ hashFiles('build/install-public-deps.mjs', 'build/public-dependencies.lock.json') }}
      - name: 校验已入库的原始发行资源
        run: node build/verify-bundled-assets.mjs
      - name: 校验 Claude API 原始 26 份技能资源
        run: node build/restore-claude-api.mjs --verify
      - name: 从源码映射恢复精确依赖快照
        run: node build/restore-dependencies.mjs
      - name: 安装缺失的完整第三方依赖
        run: node build/install-public-deps.mjs
      - uses: actions/cache/save@v4
        if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.npm
            .rebuild/public
          key: rebuild-deps-${{ runner.os }}-${{ hashFiles('build/install-public-deps.mjs', 'build/public-dependencies.lock.json') }}
      - name: 仅从 src 源码构建
        run: bun build/rebuild.mjs
      - name: 新构建版本和基础交互验收
        run: |
          set -euo pipefail
          test -f dist/cli.js
          bun dist/cli.js --version | grep -F '2.1.88'
          bun dist/cli.js --help | grep -F -- '--print'
      - name: 打包独立发行程序和平台资源
        run: node build/package-release.mjs
      - name: 校验发行文件完整性与启动器
        run: node --test tests/release-integrity.test.mjs
      - name: 验证发行包在仓库外独立运行
        run: node --test tests/distribution-isolation.test.mjs
      - name: 与原版 CLI 参数和命令差分验收
        run: node --test tests/cli-parity.test.mjs
      - name: 核对升级任务卡与功能场景映射及新增行为边界
        run: node --test tests/upgrade-coverage.test.mjs tests/fallback-model-chain.test.mjs tests/auto-compact-window.test.mjs
      - name: --tools default、指定工具与空工具实际模型请求差分验收
        run: node --test tests/tool-presets.test.mjs
      - name: 模拟 529 过载并验证 2.1.310 三段模型回退
        run: node --test tests/fallback-529-integration.test.mjs
      - name: 缓存官方 2.1.310 Linux x64 行为基准
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .rebuild/oracle/claude
          key: claude-2.1.310-linux-x64-b73676430af12f97316a798b8371f81d640f90a58bdcb8f3ce56a835bb47df56
      - name: 校验并运行官方固定版本 x64 差分基准
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p .rebuild/oracle
          if [ ! -f .rebuild/oracle/claude ]; then
            curl --fail --location --silent --show-error --retry 3 \
              https://downloads.claude.ai/claude-code-releases/2.1.310/linux-x64/claude \
              --output .rebuild/oracle/claude
          fi
          echo "b73676430af12f97316a798b8371f81d640f90a58bdcb8f3ce56a835bb47df56  .rebuild/oracle/claude" | sha256sum --check
          chmod 755 .rebuild/oracle/claude
          .rebuild/oracle/claude --version | grep -F '2.1.310'
          CLAUDE_2310_X64="$PWD/.rebuild/oracle/claude" node --test tests/fallback-529-integration.test.mjs
      - name: 2.1.310 模式规则单元测试
        run: node --test tests/upgrade-mode-options.test.mjs
      - name: 受限与安全模式实际权限及模型工具清单差分验收
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            CLAUDE_2310_X64="$PWD/.rebuild/oracle/claude" node --test tests/upgrade-mode-integration.test.mjs
          else
            node --test tests/upgrade-mode-integration.test.mjs
          fi
      - name: 模拟模型回调与本地 Read 工具端到端差分验收
        run: node --test tests/model-loop-local.test.mjs
      - name: Glob 与 Grep 文件搜索模型工具往返差分验收
        run: node --test tests/search-loop-local.test.mjs
      - name: 验收已恢复 Claude API 内置技能的全部原文进入新版 CLI
        run: node --test tests/claude-api-skill.test.mjs
      - name: 保存独立重建版发行产物
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-claude-2.1.88-${{ matrix.os }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
  research-integrity:
    name: 核验全量源码映射研究数据
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 对照原始 cli.js.map 全量只读复核研究目录
        run: python3 research/claude-code-2.1.88/generate.py --verify
      - name: 确认复核流程没有改写任何文件
        run: test -z "$(git status --porcelain)"
