      - name: 复测会话 ZIP 插件实际装载与目录权限
        id: acceptance_030
        continue-on-error: true
        run: bun test tests/session-plugin-sources.test.mjs
      - name: 官方x64与重建版旧代理向导退场真实行为对照
        id: acceptance_031
        continue-on-error: true
        if: runner.os == 'Linux'
        run: CLAUDE_TARGET_X64="$PWD/.rebuild/oracle/claude" node --test tests/m1-obsolete-command-parity.test.mjs
      - name: 后台会话原版 x64 与构建版行为严格对照
        id: acceptance_032
        continue-on-error: true
        if: runner.os == 'Linux'
        run: CLAUDE_TARGET_X64="$PWD/.rebuild/oracle/claude" node --test tests/m1-background-agent-parity.test.mjs
      - name: 官方 x64 与移植版后台会话双端生命周期验收
        id: acceptance_033
        continue-on-error: true
        if: runner.os == 'Linux'
