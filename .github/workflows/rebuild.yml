        run: node --test tests/m6-ultrareview-unrelated-history-317.test.mjs
      - name: 317云端审查启动配置与远端轮询一致性
        id: acceptance_045
        continue-on-error: true
        run: node --test tests/m6-ultrareview-runtime-config-317.test.mjs
      - name: 与原版 CLI 参数和命令差分验收
