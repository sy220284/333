name: 源码独立重建验证
on:
  push:
    branches: [main, rebuild/bun-from-src]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Windows 提前启用 Git 长路径（完整保留嵌套依赖源码）
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: |
            ~/.npm
            .rebuild/public
          key: rebuild-deps-${{ runner.os }}-${{ hashFiles('build/install-public-deps.mjs', 'build/public-dependencies.lock.json') }}
      - name: 校验已入库的原始发行资源
        run: node build/verify-bundled-assets.mjs
      - name: 校验 Claude API 2.1.310 技能资源
        run: node build/restore-claude-api.mjs --verify
      - name: 从源码映射恢复精确依赖快照
        run: node build/restore-dependencies.mjs
      - name: 安装缺失的完整第三方依赖
        run: node build/install-public-deps.mjs
      - uses: actions/cache/save@v4
        if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.npm
            .rebuild/public
          key: rebuild-deps-${{ runner.os }}-${{ hashFiles('build/install-public-deps.mjs', 'build/public-dependencies.lock.json') }}
      - name: 验收SDK控制消息与快捷键配置的真实解析协议
        run: bun test tests/sdk-control-protocol.test.ts tests/keybinding-schema-contract.test.ts tests/bridge-capability-contract.test.ts tests/context-hint-microcompact.test.ts tests/context-hint-controller.test.ts tests/sdk-stream-events.test.ts tests/browser-mcp-extension-detection.test.ts tests/sdk-stream-accumulator.test.ts
      - name: 仅从 src 源码构建
        run: bun build/rebuild.mjs
      - name: 新构建版本和基础交互验收
        run: |
          set -euo pipefail
          test -f dist/cli.js
          bun dist/cli.js --version | grep -F '2.1.88'
          bun dist/cli.js --help | grep -F -- '--print'
      - name: 打包独立发行程序和平台资源
        run: node build/package-release.mjs
      - name: 校验发行文件完整性与启动器
        run: node --test tests/release-integrity.test.mjs
      - name: 验证发行包在仓库外独立运行
        run: node --test tests/distribution-isolation.test.mjs
      - name: 与原版 CLI 参数和命令差分验收
        run: node --test tests/cli-parity.test.mjs
      - name: 复核多级模型回退与自动压缩真实参数语义
        run: node --test tests/upgrade-coverage.test.mjs tests/fallback-model-chain.test.mjs tests/auto-compact-window.test.mjs
      - name: 复核529故障后的模型回退与工具集合权限
        run: node --test tests/fallback-529-integration.test.mjs tests/tool-presets.test.mjs
      - name: 复核新版CLI参数、云目标与系统提示快照
        run: node --test tests/upgrade-mode-options.test.mjs tests/cloud-target.test.mjs tests/system-prompt-snapshot.test.mjs
      - name: 复核新版受限模式的入口到模型执行
        run: node --test tests/upgrade-mode-integration.test.mjs
      - name: 复测会话 ZIP 插件实际装载与目录权限
        run: bun test tests/session-plugin-sources.test.mjs
      - name: 取得已锁定SHA的原版2.1.310 Linux x64执行参考
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p .rebuild/oracle
          curl --fail --location --silent --show-error --http1.1 --retry-all-errors --retry 5 --retry-delay 2 \
            'https://downloads.claude.ai/claude-code-releases/2.1.310/linux-x64/claude' \
            --output .rebuild/oracle/claude
          echo "b73676430af12f97316a798b8371f81d640f90a58bdcb8f3ce56a835bb47df56  .rebuild/oracle/claude" | sha256sum --check
          chmod 755 .rebuild/oracle/claude
      - name: 对原版和当前构建版实际注入529并验证模型回退顺序
        if: runner.os == 'Linux'
        run: CLAUDE_2310_X64="$PWD/.rebuild/oracle/claude" node --test tests/fallback-529-integration.test.mjs
      - name: 对原版和当前构建版实际验证安全模式与工具权限
        if: runner.os == 'Linux'
        run: CLAUDE_2310_X64="$PWD/.rebuild/oracle/claude" node --test tests/upgrade-mode-integration.test.mjs
      - name: 验证系统提示词在实际模型请求中的分层及磁盘快照
        if: runner.os == 'Linux'
        run: node --test tests/system-prompt-api-roundtrip.test.mjs
      - name: 模拟模型回调与本地 Read 工具端到端差分验收
        run: node --test tests/model-loop-local.test.mjs
      - name: Glob 与 Grep 文件搜索模型工具往返差分验收
        run: node --test tests/search-loop-local.test.mjs
      - name: 验证 Claude API 资源和失败重试
        run: node --test tests/claude-api-skill.test.mjs tests/claude-api-prompt.test.mjs tests/bundled-skill-extraction.test.mjs
      - name: 验证 Claude API 版本迁移命令的实际读取链路
        if: runner.os != 'Linux'
        run: node --test tests/claude-api-version-parity.test.mjs
      - name: 对照官方 x64 验证 Claude API 版本迁移命令和资源
        if: runner.os == 'Linux'
        run: CLAUDE_2310_X64="$PWD/.rebuild/oracle/claude" node --test tests/claude-api-version-parity.test.mjs
      - name: 保存独立重建版发行产物
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-claude-2.1.88-${{ matrix.os }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
  research-integrity:
    name: 核验全量源码映射研究数据
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 对照原始 cli.js.map 全量只读复核研究目录
        run: python3 research/claude-code-2.1.88/generate.py --verify
      - name: 确认复核流程没有改写任何文件
        run: test -z "$(git status --porcelain)"
