name: 333 Bun 类型依赖锁更新候选

on:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: main-ci-governance-bun-types-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: 生成精确 Bun 类型锁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取权威工具链版本
        shell: bash
        run: node tools/dev/toolchain.mjs gha-env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.TOOLCHAIN_NODE_VERSION }}
      - name: 更新开发类型锁
        run: |
          node tools/dev/toolchain.mjs check
          npm install --prefix tools/dev --package-lock-only --ignore-scripts --no-audit --no-fund
          node tools/dev/toolchain.mjs check
          echo 'BUN_LOCK_BEGIN'
          base64 -w0 tools/dev/package-lock.json
          echo
          echo 'BUN_LOCK_END'
      - uses: actions/upload-artifact@v4
        with:
          name: 333-bun-types-lock
          path: |
            tools/dev/package.json
            tools/dev/package-lock.json
          if-no-files-found: error
