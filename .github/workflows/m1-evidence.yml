      - 'src/ink/terminal-querier.ts'
      - 'src/ink/parse-keypress.ts'
      - 'src/commands/privacy-settings/**'
      - 'tests/m1-release-routing.test.mjs'
      - 'tests/m1-mcp-reconnect-policy.test.mjs'
      - 'src/services/mcp/reconnectGate.ts'
      - 'src/services/mcp/config.ts'
      - 'src/services/mcp/client.ts'
      - 'src/services/mcp/useManageMCPConnections.ts'
      - 'tests/upgrade-coverage.test.mjs'
      - '.github/workflows/m1-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m1-source-evidence:
    name: 校验完整源码索引与官方原始变更
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 验证2.1.317统一验收目标及Read和子代理策略
        run: |
          node --test tests/m1-target-release-317.test.mjs tests/m1-target-release-runner.test.mjs
          node build/m1-run-target-tests.mjs
      - name: 验证2.1.310上下文提示和工具结果安全清理的真实逻辑
        run: bun test tests/context-hint-controller.test.ts tests/context-hint-microcompact.test.ts
      - name: 验证交互式及SDK上下文查看使用实际模型消息边界
        run: node --test tests/compatibility-retirement.test.mjs tests/plugin-migration-boundaries.test.mjs tests/m1-context-view-release-parity.test.mjs tests/m1-context-ui-release-parity.test.mjs tests/current-session-id-protocol.test.mjs tests/new-permission-syntax.test.mjs
      - name: 验证Ink开发者工具本地连接及清理生命周期
        run: node --experimental-strip-types --test tests/m1-ink-devtools.test.mjs
      - name: 验证任务卡、功能、场景及旧开关/新锚点/版本记录
        run: node --test tests/m1-workflow-cache.test.mjs tests/m1-workflow-commands.test.mjs tests/m1-workflow-meta-literal.test.mjs tests/m1-workflow-finalization.test.mjs tests/m1-workflow-history.test.mjs tests/m1-workflow-storage.test.mjs tests/m1-workflow-runtime.test.mjs tests/m1-monitor-protocol.test.mjs tests/m1-monitor-task-identity.test.mjs tests/m1-account-peer-discovery.test.mjs tests/upgrade-coverage.test.mjs tests/m1-verify.test.mjs tests/m1-telemetry-policy.test.mjs tests/m1-release-routing.test.mjs tests/m1-privacy-settings.test.mjs tests/m1-snapshot-terminal-behavior.test.mjs tests/m1-source-gap-audit.test.mjs tests/m1-inline-map-audit.test.mjs tests/m1-v4-handoff.test.mjs tests/m1-doctor-source-restoration.test.mjs tests/m1-spinner-tips.test.mjs tests/m1-custom-spinner-tips.test.mjs tests/m1-list-agents.test.mjs tests/m1-tool-pool-single-source.test.mjs tests/m1-screen-reader-mode.test.mjs tests/m1-taskoutput-retirement.test.mjs
      - name: 验证 CA 证书来源隔离与宿主管理边界
        run: node --experimental-strip-types --test tests/m1-ca-cert-source-policy.test.mjs
      - name: 验证禁用及企业策略限制 MCP 重新连接
        run: node --experimental-strip-types --test tests/m1-mcp-reconnect-policy.test.mjs
      - name: 验证无界面MCP授权未答复时禁止重复执行
        run: node --experimental-strip-types --test tests/m1-mcp-headless-elicitation-result.test.mjs
      - name: 验证无界面MCP工具超时与并发授权状态隔离
        run: node --experimental-strip-types --test tests/m1-mcp-headless-pending.test.mjs
      - name: 验证读取符号链接时的真实文件目标与越界提示
        run: node --experimental-strip-types --test tests/m1-symlink-read-permission.test.mjs
      - name: 验证102项能力运行证据矩阵
        run: node build/m1-evidence/generate-runtime-acceptance.mjs --check
      - name: 验证远程流事件合并及 SDK 字段映射
        run: node --test tests/m1-sdk-stream-coalescing.test.mjs tests/m1-sdk-stream-mapping.test.mjs tests/m1-thinking-display.test.mjs
      - name: 生成PR7前研究库90项功能开关的三版本源码差分
        run: node build/m1-research-cross-audit.mjs "${RUNNER_TEMP}/m1-pre-pr7-research-90-flags.json"
      - name: 保存90项历史研究缺口和新版迁移责任的可复验证据
        uses: actions/upload-artifact@v4
        with:
          name: m1-legacy-research-90-flags
          path: ${{ runner.temp }}/m1-pre-pr7-research-90-flags.json
          retention-days: 90
          if-no-files-found: error
      - name: 安装固定TypeScript校验器
        run: npm install --prefix "${RUNNER_TEMP}/m1-typescript" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: 验证源码缺口扫描的资源文件、JSX映射与真实缺失识别
        env:
          M1_TYPESCRIPT_MODULE: ${{ runner.temp }}/m1-typescript/node_modules/typescript/lib/typescript.js
        run: node --test tests/m1-source-gap-ast.test.mjs
      - name: 编译已恢复类型的正反向契约
        run: node "${RUNNER_TEMP}/m1-typescript/node_modules/typescript/lib/tsc.js" --strict --noEmit --skipLibCheck --target ES2023 --module ESNext --moduleResolution Bundler tests/m1-notebook-types.fixture.ts tests/m1-core-types.fixture.ts tests/m1-feedback-types.fixture.ts
      - name: 编译并执行新版终端粘贴事件协议回归
        run: |
          printf 'declare const Bun: { stripANSI(input: string): string }\n' > "${RUNNER_TEMP}/m1-bun-ambient.d.ts"
          node "${RUNNER_TEMP}/m1-typescript/node_modules/typescript/lib/tsc.js" --strict --skipLibCheck --target ES2023 --module CommonJS --moduleResolution Node --rootDir src/ink --outDir "${RUNNER_TEMP}/m1-ink-events" src/ink/events/paste-event.ts "${RUNNER_TEMP}/m1-bun-ambient.d.ts"
          M1_INK_EVENTS_DIR="${RUNNER_TEMP}/m1-ink-events" node --test tests/m1-ink-paste-event.test.mjs
      - name: 验证18组功能升级、102能力及84场景证据签收分层
        run: |
          node --test tests/m1-feature-evidence-registry.test.mjs
          node build/m1-feature-evidence-registry.mjs --report "${RUNNER_TEMP}/m1-feature-evidence-registry.json"
      - name: 扫描当前分支的实际缺失类型与运行模块
        run: node build/m1-source-gap-ast.mjs --old-src src --typescript-module "${RUNNER_TEMP}/m1-typescript/node_modules/typescript/lib/typescript.js" --out "${RUNNER_TEMP}/m1-current-source-gaps.json"
      - name: 保存逐路径导入与符号契约证据
        uses: actions/upload-artifact@v4
        with:
          name: m1-current-source-gaps
          path: ${{ runner.temp }}/m1-current-source-gaps.json
          retention-days: 30
          if-no-files-found: error
      - name: 校验旧版内嵌原始Source Map及恢复索引
        run: python3 build/m1-inline-source-map-audit.py --source-dir src --output "${RUNNER_TEMP}/m1-inline-source-snapshots.json"
      - name: 保存可追溯原始TypeScript来源快照摘要
        uses: actions/upload-artifact@v4
        with:
          name: m1-inline-source-snapshots
          path: ${{ runner.temp }}/m1-inline-source-snapshots.json
          retention-days: 30
          if-no-files-found: error
      - name: 下载固定发行版的官方变更记录
        run: |
          curl --fail --location --show-error --silent --retry 3 \
            'https://raw.githubusercontent.com/anthropics/claude-code/v2.1.310/CHANGELOG.md' \
            --output "${RUNNER_TEMP}/claude-changelog-2.1.310.md"
      - name: 用 Git Blob SHA 与逐行位置复核六千余项原始记录
        run: node build/m1-verify.mjs --changelog "${RUNNER_TEMP}/claude-changelog-2.1.310.md"
      - name: 确认只读验证没有改写研究数据
        run: test -z "$(git status --porcelain)"

  m1-reference-linux-x64:
    name: 2.1.310 原版 Linux x64 真实 CLI 对照
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载固定目标版官方 x64 程序
        run: |
          curl --fail --location --silent --show-error --http1.1 --retry-all-errors --retry 5 --retry-delay 2 \
            "https://downloads.claude.ai/claude-code-releases/2.1.310/linux-x64/claude" \
            --output "${RUNNER_TEMP}/claude-2.1.310-linux-x64"
          echo "b73676430af12f97316a798b8371f81d640f90a58bdcb8f3ce56a835bb47df56  ${RUNNER_TEMP}/claude-2.1.310-linux-x64" | sha256sum --check
          chmod 700 "${RUNNER_TEMP}/claude-2.1.310-linux-x64"
      - name: 使用隔离配置实际运行官方 x64 无授权功能矩阵
        run: |
          node build/m1-x64-reference-probe.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --report "${RUNNER_TEMP}/m1-reference-linux-x64.json"
      - name: 运行本机模拟API流式/Read工具权限闭环
        run: |
          python3 -m unittest discover -s tests -p 'm1_x64_stream_events_test.py'
          python3 tests/m1-x64-local-api.py \
            --binary "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --report "${RUNNER_TEMP}/m1-x64-local-api.json"
      - name: 保存本机API工具调用真实测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-x64-loopback-tool-roundtrip
          path: ${{ runner.temp }}/m1-x64-local-api.json
          retention-days: 30
          if-no-files-found: warn
      - name: 保存实测退出码与契约判定
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-reference-linux-x64-probe
          path: ${{ runner.temp }}/m1-reference-linux-x64.json
          if-no-files-found: warn
          retention-days: 30

  m1-biome-safe-fix-evidence:
    name: M1 安全修复建议补丁（不自动提交）
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装锁定版本的Biome
        run: npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
      - name: 对本PR源文件生成安全修复建议
        shell: bash
        run: |
          git fetch origin main
          mapfile -d '' changed < <(git diff -z --name-only --diff-filter=ACM origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs')
          echo "待核实文件数: ${#changed[@]}"
          if (( ${#changed[@]} )); then
            set +e
            tools/dev/node_modules/.bin/biome lint --write --unsafe --only=lint/style/useTemplate --no-errors-on-unmatched "${changed[@]}" tools/dev/*.mjs
            rc=$?
            set -e
            echo "Biome 自动修复后的退出码: $rc"
          fi
          git diff --binary > "$RUNNER_TEMP/m1-biome-safe-fix.patch"
          git diff --name-only > "$RUNNER_TEMP/m1-biome-changed-files.txt"
          test -s "$RUNNER_TEMP/m1-biome-safe-fix.patch" || echo "当前没有可自动安全修复的变化" > "$RUNNER_TEMP/m1-biome-no-safe-fixes.txt"
      - name: 上传未应用的安全修复建议供逐文件审查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-biome-safe-fix-review
          path: |
            ${{ runner.temp }}/m1-biome-safe-fix.patch
            ${{ runner.temp }}/m1-biome-changed-files.txt
            ${{ runner.temp }}/m1-biome-no-safe-fixes.txt
          retention-days: 7
          if-no-files-found: warn

  m1-target-vs-current-source:
    name: M1 官方x64与当前源码重建版同条件差分
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 校验旧源码快照并恢复构建依赖
        run: |
          node build/verify-bundled-assets.mjs
          node build/restore-claude-api.mjs --verify
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 复核新版微压缩来源标记及工具结果持久化
        run: bun test tests/context-hint-microcompact.test.ts
      - name: 验证2.1.310自动主题通知、OSC11查询及取消订阅的运行行为
        run: bun test tests/m1-system-theme-watcher.test.ts
      - name: 验证2.1.310双时钟阻塞检测与SIGCONT清理
        run: bun test tests/m1-event-loop-stall.test.ts
      - name: 验证结构化差异着色已接通TS移植实现及关闭逻辑
        run: bun test tests/m1-color-diff-contract.test.ts
      - name: 验证着色模块CJS与ESM语法表动态加载的实际能力
        run: bun test tests/m1-highlight-runtime.test.ts
      - name: 跨进程真实消息交付回归
        run: bun test tests/m1-uds-roundtrip.test.ts
      - name: 对照新版Computer Use系统级敏感应用权限识别
        run: bun test tests/m1-computer-use-sentinel.test.ts
      - name: 验证流式生成器的结束返回值和并发输出
        run: bun test tests/m1-generators.test.ts
      - name: 验证 MCP 服务输入参数合法性与内部字段拒绝
        run: bun test tests/m1-mcp-argument-validation.test.ts
      - name: 验证 SDK 到 MCP 的 JSON-RPC 消息类型及拒绝非法消息
        run: bun test tests/m1-sdk-mcp-message-validation.test.ts
      - name: 验证 SDK 助手、用户及 UUID 核心消息结构
        run: bun test tests/m1-sdk-message-contract.test.ts
      - name: 验证 SDK 流事件模式与远程合并的 Bun 运行链路
        run: bun test tests/sdk-stream-events.test.ts tests/sdk-stream-accumulator.test.ts tests/m1-ccr-close.test.ts
      - name: 从当前M1源码独立构建候选程序
        run: bun build/rebuild.mjs
      - name: 准备官方x64对照程序与真实候选启动器
        run: |
          curl --fail --location --silent --show-error --http1.1 --retry-all-errors --retry 5 --retry-delay 2 \
            "https://downloads.claude.ai/claude-code-releases/2.1.310/linux-x64/claude" \
            --output "${RUNNER_TEMP}/claude-2.1.310-linux-x64"
          echo "b73676430af12f97316a798b8371f81d640f90a58bdcb8f3ce56a835bb47df56  ${RUNNER_TEMP}/claude-2.1.310-linux-x64" | sha256sum --check
          chmod 700 "${RUNNER_TEMP}/claude-2.1.310-linux-x64"
          printf '#!/bin/sh\nexec bun "%s/dist/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "${RUNNER_TEMP}/m1-current-cli"
          chmod 700 "${RUNNER_TEMP}/m1-current-cli"
      - name: 对照官方2.1.310与重建版的真实伪终端屏幕阅读器输出
        run: |
          python3 tests/m1-screen-reader-terminal-parity.py \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --report "${RUNNER_TEMP}/m1-screen-reader-terminal.json"
      - name: 对照真实 SDK 流事件顺序、响应标识与首字时间
        run: |
          node build/m1-sdk-stream-wire-parity.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --report "${RUNNER_TEMP}/m1-sdk-stream-wire.json"
      - name: 对照显式思考展示配置及关闭思考时的流事件
        run: |
          node build/m1-sdk-thinking-display-parity.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --report "${RUNNER_TEMP}/m1-sdk-thinking-display.json"
      - name: 执行同条件CLI差分采集（未对齐项仍保留在JSON，严格等价另验）
        run: |
          node build/m1-x64-reference-probe.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --allow-candidate-diff true \
            --require-candidate-cases "mcp_help,plugin_help,mcp_list_empty,plugin_list_empty,invalid_output,invalid_permission,json_without_login,stream_without_login" \
            --report "${RUNNER_TEMP}/m1-x64-current-differential.json"
      - name: 用隔离本机API严格验证单轮413终止及两轮会话自动恢复
        run: |
          node build/m1-413-recovery-probe.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --allow-candidate-diff false \
            --report "${RUNNER_TEMP}/m1-413-recovery-differential.json"
      - name: 用真实终端对照自定义提示及文件配置
        run: |
          python3 -m pip install --disable-pip-version-check pyte==0.8.2
          python3 tests/m1-x64-spinner-tips.py \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli"
      - name: 以真实ToolSearch调用核查新版延迟注册及当前候选差异
        run: |
          node build/m1-toolsearch-release-parity.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --allow-candidate-diff true \
            --report "${RUNNER_TEMP}/m1-toolsearch-differential.json"
      - name: 用真实 CLI 与本机模拟 API 验收 Monitor 和纯脚本 Workflow
        run: |
          node build/m1-monitor-workflow-roundtrip.mjs \
            --reference "${RUNNER_TEMP}/claude-2.1.310-linux-x64" \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --report "${RUNNER_TEMP}/m1-monitor-workflow-roundtrip.json"
      - name: 按v4把原版x64差异转换为源码修改责任和验收任务
        run: |
          node build/m1-v4-handoff.mjs \
            --input "${RUNNER_TEMP}/m1-x64-current-differential.json" \
            --out "${RUNNER_TEMP}/m1-v4-development-handoff.json"
      - name: 空命令和流式无输出的隔离调试（不参与等价判定）
        run: |
          node build/m1-cli-diagnose.mjs \
            --candidate "${RUNNER_TEMP}/m1-current-cli" \
            --out "${RUNNER_TEMP}/m1-cli-startup-diagnostics.json"
      - name: 不论是否发现差异都保存可复核证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-x64-source-differential
          path: |
            ${{ runner.temp }}/m1-x64-current-differential.json
            ${{ runner.temp }}/m1-v4-development-handoff.json
            ${{ runner.temp }}/m1-cli-startup-diagnostics.json
            ${{ runner.temp }}/m1-413-recovery-differential.json
            ${{ runner.temp }}/m1-toolsearch-differential.json
            ${{ runner.temp }}/m1-monitor-workflow-roundtrip.json
            ${{ runner.temp }}/m1-sdk-stream-wire.json
            ${{ runner.temp }}/m1-sdk-thinking-display.json
            ${{ runner.temp }}/m1-screen-reader-terminal.json
          retention-days: 30
          if-no-files-found: warn
