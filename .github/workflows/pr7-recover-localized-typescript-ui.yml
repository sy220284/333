name: PR7 中文UI原始TypeScript按组恢复与验收
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/pr7-recover-localized-typescript-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr7-localized-tsx-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 初始化TypeScript及源码所需真实依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 核验已有整个仓库源码类型基线
        run: node tools/dev/dev.mjs typecheck:all
      - name: 用内嵌映射恢复原始TSX并移植全部中文界面文案
        run: node tools/dev/reconstruct-localized-original-tsx.mjs --apply
      - name: 按功能兼容性逐组验证原始TypeScript组件
        run: node tools/dev/validate-localized-tsx-batch.mjs
      - name: 真正核验中文界面、严格TS、构建与交互
        run: |
          node tools/dev/audit-restored-ui-localization.mjs
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs
          node --test tests/welcome-layout.test.mjs tests/chinese-only-ui.test.mjs tests/brand-animation.test.mjs
          git diff --check
      - name: 提交确实通过校验且保留中文的原始TSX组件
        shell: bash
        run: |
          set -euo pipefail
          git add src
          if git diff --cached --quiet; then echo '没有可提交的原始TSX'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '恢复中文UI组件的原始TypeScript源码并保持现有中文交互'
          for attempt in 1 2 3 4 5; do
            git fetch origin upgrade/2.1.310-m1-evidence
            git rebase origin/upgrade/2.1.310-m1-evidence
            node tools/dev/dev.mjs typecheck:all
            node tools/dev/audit-restored-ui-localization.mjs
            if git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence; then exit 0; fi
          done
          exit 1
      - name: 保存已恢复与剩余需重写组件的验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-localized-tsx-restoration
          path: |
            .rebuild/governance/localized-original-tsx-reconstruction.json
            .rebuild/governance/localized-tsx-accepted.json
            .rebuild/governance/type-migration-report.json
          retention-days: 30
          if-no-files-found: warn
