name: 校正源码研究归档的原始字节
on:
  push:
    branches: [research/2.1.88-complete-map]
jobs:
  restore-exact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 从原始映射重建每个文件（保留 CRLF）
        run: python3 research/claude-code-2.1.88/generate.py
      - name: 验证本地全部 2862 个生成文件
        run: python3 research/claude-code-2.1.88/generate.py --verify
      - name: 强制保留原始依赖源代码的完整字节
        run: |
          git add -f research/claude-code-2.1.88/dependencies/node_modules/
          git add research/claude-code-2.1.88/
          test "$(git ls-files --cached research/claude-code-2.1.88/dependencies/node_modules/ | wc -l)" -eq 2850
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "保持 2850 份依赖源码与映射中的 CRLF 原始字节完全一致"
            git push origin HEAD:research/2.1.88-complete-map
          fi
