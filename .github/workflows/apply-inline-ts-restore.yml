name: 可信原始TSX源码第一批恢复与编译验收
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/apply-inline-ts-restore.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 安装冻结TS编译器与源码依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 恢复232个已核验内嵌源码文件
        run: node tools/dev/restore-inline-ts-source.mjs --apply --limit=232
      - name: 按模块调用链隔离冲突并恢复可编译的TypeScript原始源码
        run: |
          node tools/dev/restore-inline-ts-compatible.mjs
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
      - name: 真实生产打包与格式检查
        run: |
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs
          git diff --check
      - name: 按当前PR分支重新同步并提交原始源码
        run: |
          set -euo pipefail
          git add src native
          if git diff --cached --quiet; then
            echo '未出现可以验证的源码差异'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '恢复原始TypeScript与TSX源码：批量替换反编译产物并完成严格验收'
          git fetch origin upgrade/2.1.310-m1-evidence
          git rebase origin/upgrade/2.1.310-m1-evidence
          git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence
      - name: 记录恢复范围与审计数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-original-typescript-batch
          path: |
            .rebuild/governance/inline-ts-source-recovery.json
            .rebuild/governance/type-migration-report.json
            .rebuild/governance/inline-ts-compatible-report.json
          retention-days: 30
          if-no-files-found: warn
