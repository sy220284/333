name: 可信原始TSX源码第一批恢复与编译验收
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/apply-inline-ts-restore.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 安装冻结TS编译器与源码依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 恢复232个已核验内嵌源码文件
        run: node tools/dev/restore-inline-ts-source.mjs --apply --limit=232
      - name: 保留通过真实接口检查的原始源码，记录需要进一步改写的文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rebuild/governance
          : > .rebuild/governance/inline-restore-rejected.txt
          for round in $(seq 1 25); do
            if node tools/dev/dev.mjs typecheck:all > .rebuild/governance/inline-restore-types.log 2>&1; then
              echo "第 $round 轮类型检查通过"
              break
            fi
            mapfile -t bad < <(grep -Eo 'src/[^ ()]+\.(ts|tsx)\([0-9]+,[0-9]+\)' .rebuild/governance/inline-restore-types.log | sed -E 's/\([0-9]+,[0-9]+\)$//' | sort -u || true)
            reverted=0
            for path in "${bad[@]}"; do
              if [ -f "$path" ] && ! git diff --quiet -- "$path"; then
                echo "兼容问题转下一批处理：$path"
                echo "$path" >> .rebuild/governance/inline-restore-rejected.txt
                git restore -- "$path"
                reverted=$((reverted+1))
              fi
            done
            if [ "$reverted" -eq 0 ]; then
              echo '类型错误涉及未恢复模块，保留原始错误并停止验收'
              cat .rebuild/governance/inline-restore-types.log
              exit 1
            fi
            if [ "$round" -eq 25 ]; then
              echo '兼容检查轮数耗尽，尚有未修复的源码冲突'
              exit 1
            fi
          done
          sort -u .rebuild/governance/inline-restore-rejected.txt -o .rebuild/governance/inline-restore-rejected.txt
          echo "待继续重写文件数：$(wc -l < .rebuild/governance/inline-restore-rejected.txt)"
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
      - name: 真实生产打包与格式检查
        run: |
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs
          git diff --check
      - name: 按当前PR分支重新同步并提交原始源码
        run: |
          set -euo pipefail
          git add src native
          if git diff --cached --quiet; then
            echo '未出现可以验证的源码差异'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '恢复原始TypeScript与TSX源码：批量替换反编译产物并完成严格验收'
          git fetch origin upgrade/2.1.310-m1-evidence
          git rebase origin/upgrade/2.1.310-m1-evidence
          git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence
      - name: 记录恢复范围与审计数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-original-typescript-batch
          path: |
            .rebuild/governance/inline-ts-source-recovery.json
            .rebuild/governance/type-migration-report.json
            .rebuild/governance/inline-restore-rejected.txt
            .rebuild/governance/inline-restore-types.log
          retention-days: 30
          if-no-files-found: warn
