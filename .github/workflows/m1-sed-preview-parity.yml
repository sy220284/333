name: M1 Bash 文件编辑与 Notebook 单元格真实链路验收

on:
  pull_request:
    paths:
      - 'src/tools/BashTool/sedEditParser.ts'
      - 'src/tools/BashTool/BashTool.tsx'
      - 'src/components/permissions/SedEditPermissionRequest/SedEditPermissionRequest.tsx'
      - 'tests/sed-edit-parity.test.ts'
      - 'tests/sed-edit-write-integration.test.ts'
      - 'src/tools/NotebookEditTool/NotebookEditTool.ts'
      - 'src/tools/NotebookEditTool/notebookMutation.ts'
      - 'src/utils/notebook.ts'
      - 'src/utils/notebookCells.ts'
      - 'src/utils/notebookFileLock.ts'
      - 'tests/notebook-edit-parity.test.ts'
      - 'tests/notebook-edit-write-integration.test.ts'
      - 'tests/notebook-read-edit-integration.test.ts'
      - 'tests/m1-link-production-adapters.mjs'
      - '.github/workflows/m1-sed-preview-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-edit-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复原版依赖环境
        run: |
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 仅检查本 PR 修改的 TypeScript 文件（独立于历史质量基线）
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node tools/dev/node_modules/@biomejs/biome/bin/biome lint --no-errors-on-unmatched src/components/permissions/SedEditPermissionRequest/SedEditPermissionRequest.tsx src/tools/BashTool/BashTool.tsx src/tools/BashTool/sedEditParser.ts src/tools/NotebookEditTool/NotebookEditTool.ts src/tools/NotebookEditTool/notebookMutation.ts src/utils/notebook.ts src/utils/notebookCells.ts src/utils/notebookFileLock.ts tests/notebook-edit-parity.test.ts tests/notebook-edit-write-integration.test.ts tests/notebook-read-edit-integration.test.ts tests/sed-edit-parity.test.ts tests/sed-edit-write-integration.test.ts tests/m1-link-production-adapters.mjs
      - name: 对照本机 GNU/BSD sed 验证预览与真实文件写入
        run: bun test tests/sed-edit-parity.test.ts
      - name: Notebook 单元格身份、类型变更与格式一致性
        run: bun test tests/notebook-edit-parity.test.ts
      - name: 验证实际 BashTool 与 NotebookEditTool 写入及并发编辑保护
        run: |
          node tests/m1-link-production-adapters.mjs
          bun test tests/sed-edit-write-integration.test.ts tests/notebook-edit-write-integration.test.ts tests/notebook-read-edit-integration.test.ts

  notebook-windows:
    name: Notebook 原位编辑（Windows）
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: 允许检出研究档案中的 Windows 长路径
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复原版依赖环境
        run: |
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 校验 Notebook 本次修改源码和用例
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node tools/dev/node_modules/@biomejs/biome/bin/biome lint --no-errors-on-unmatched src/tools/NotebookEditTool/NotebookEditTool.ts src/tools/NotebookEditTool/notebookMutation.ts src/utils/notebook.ts src/utils/notebookCells.ts src/utils/notebookFileLock.ts tests/notebook-edit-parity.test.ts tests/notebook-edit-write-integration.test.ts tests/notebook-read-edit-integration.test.ts
      - name: Notebook 目标定位与格式回归
        run: bun test tests/notebook-edit-parity.test.ts
      - name: Notebook 实际磁盘写入及外部修改保护
        run: |
          node tests/m1-link-production-adapters.mjs
          bun test tests/notebook-edit-write-integration.test.ts tests/notebook-read-edit-integration.test.ts
