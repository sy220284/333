name: Android Node 26 运行时与独立客户端封装
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '安卓端方案/tools/runtime/**'
      - '安卓端方案/android-app/app/build.gradle.kts'
      - '.github/workflows/android-node-runtime.yml'
  push:
    branches: [main]
    paths:
      - '安卓端方案/tools/runtime/**'
      - '安卓端方案/android-app/app/build.gradle.kts'
      - '.github/workflows/android-node-runtime.yml'
permissions:
  contents: read
concurrency:
  group: node333-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验脚本来源及验证器单元测试
        shell: bash
        run: |
          set -euo pipefail
          bash -n 安卓端方案/tools/runtime/*.sh
          python3 -m unittest discover -s 安卓端方案/tools/runtime -p 'test_*.py' -v
          for program in curl gpgv python3 dpkg-deb readelf sha256sum; do command -v "$program"; done
      - name: 签名和SHA256校验后构建arm64 Android Node 26
        shell: bash
        env:
          DSH_RUNTIME_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/node333"
          bash 安卓端方案/tools/runtime/prepare-termux-node.sh "$OUT"
          python3 安卓端方案/tools/runtime/verify-node-payload.py "$OUT" --abi arm64-v8a
          python3 安卓端方案/tools/runtime/verify-node-payload.py "$OUT" --abi arm64-v8a --check-only
          test -f "$OUT/jniLibs/arm64-v8a/libdsh_node.so"
          du -h "$OUT/jniLibs/arm64-v8a/libdsh_node.so"
      - uses: actions/upload-artifact@v4
        with:
          name: 333-node26-android-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/node333/
          if-no-files-found: error
          retention-days: 30
  package-client-with-node:
    needs: prepare-node
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          name: 333-node26-android-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/node333
      - name: 离线复核收到的Node payload
        run: |
          set -euo pipefail
          python3 安卓端方案/tools/runtime/verify-node-payload.py "$RUNNER_TEMP/node333" --abi arm64-v8a --check-only
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-android-333
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: APK 携带 Node 运行时并通过安卓编译
        env:
          DSH333_NODE_RUNTIME_DIR: ${{ runner.temp }}/node333
        run: |
          set -euo pipefail
          gradle -p 安卓端方案/android-app --no-daemon :app:assembleDebug :app:testDebugUnitTest
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob("安卓端方案/android-app/app/build/outputs/apk/debug/*.apk")
          assert len(apk)==1, apk
          with zipfile.ZipFile(apk[0]) as z:
              entries = z.namelist()
              assert "lib/arm64-v8a/libdsh_node.so" in entries
              assert "assets/runtime/node/node-version.txt" in entries
              assert "assets/runtime/node/integrity-manifest.json" in entries
              assert not any("/dsh-host-manifest.json" in p for p in entries), "Host has not been verified yet"
              print("Node 26 packaged; Host deployment remains a separate acceptance gate", apk[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 333-android-debug-with-node-${{ github.sha }}
          path: 安卓端方案/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
