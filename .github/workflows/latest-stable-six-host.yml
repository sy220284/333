name: 稳定版依赖六架构全量编译与真实宿主验收

on:
  push:
    branches: [upgrade/latest-stable-deps-20261105]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/dev/**'
      - '.github/workflows/latest-stable-six-host.yml'

permissions:
  contents: read

concurrency:
  # Keep the currently running six-platform build intact, and coalesce
  # superseded queued commits into the newest branch head.
  group: latest-stable-six-host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standalone:
    name: 稳定依赖六架构真实编译与发行 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-2025 }
          - { target: win32-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      M1_TARGET_PLATFORM: ${{ matrix.target }}
    steps:
      - name: Windows检出前启用长路径保留完整依赖源码
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - name: 读取权威工具链版本
        shell: bash
        run: node tools/dev/toolchain.mjs gha-env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.TOOLCHAIN_NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.TOOLCHAIN_BUN_VERSION }}
      - name: 校验开发工具链版本与实际运行时
        run: node tools/dev/toolchain.mjs verify-runtime
      - name: 真实宿主原生模块完整字节与接口
        run: node --test tests/m1-six-host-native-audio-317.test.mjs
      - name: 完整源码依赖与官方资源原样检查
        run: |
          set -euo pipefail
          node build/verify-bundled-assets.mjs
          node build/restore-claude-api.mjs --verify
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 真实源码重建2.1.317程序
        run: bun build/rebuild.mjs
      - name: 六架构独立编译二进制与发行封装
        run: |
          set -euo pipefail
          node build/compile-standalone.mjs
          node build/package-release.mjs
      - name: 自包含独立程序版本、帮助与宿主架构
        run: |
          set -euo pipefail
          binary=dist/yaoyaoche
          if [[ "$M1_TARGET_PLATFORM" == win32-* ]]; then binary=dist/yaoyaoche.exe; fi
          "$binary" --version --verbose | tee "$RUNNER_TEMP/m1-317-six-version.txt"
          "$binary" --help > "$RUNNER_TEMP/m1-317-six-help.txt"
          grep -F '2.1.317 (摇摇车)' "$RUNNER_TEMP/m1-317-six-version.txt"
          grep -F 'Usage:' "$RUNNER_TEMP/m1-317-six-help.txt"
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform+"-"+process.arch,process.env.M1_TARGET_PLATFORM)'
      - name: 发行业务完整性与仓库外启动双重验证
        run: |
          node --test tests/release-integrity.test.mjs
          node --test tests/distribution-isolation.test.mjs
      - name: 六架构原生独立程序真实模型SSE、工具与设置端到端
        run: M1_NATIVE_BINARY_RUN=1 node --test tests/m1-startup-cli-317.test.mjs
      - name: Runner、后台宿主、预热接管与 Storage V5 六架构端到端联动
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/m1-bg-spare-317.test.mjs tests/m1-daemon-worker-317.test.mjs tests/m1-preload-317.test.mjs tests/m1-runner-declares-317.test.mjs tests/m1-startup-socket-ownership-317.test.mjs
          bun test tests/m1-claim-rebind-317.test.mjs
          node --test tests/m4-session-transcript-paths-v5.test.mjs tests/m4-resume-preparation-v5.test.mjs
          bun test tests/m4-session-storage-v5-integration.test.ts
          # Verify the actual PTY transport, exec recording and background
          # supervisor dispatch/restore chain, not just a warm-spare handshake.
          node --test --test-concurrency=1 tests/m1-pty-host-317.test.mjs tests/m1-pty-recording-317.test.mjs tests/m1-background-lifecycle.test.mjs
          node --test tests/m1-fast-path-settings-317.test.mjs tests/m1-startup-argv-317.test.mjs
      - name: 317官方CLI参数与隐藏权限回调行为差分
        run: node --test tests/cli-parity.test.mjs tests/m1-marketplace-add-json-317.test.mjs
      - name: 发行元数据记录至构建证据
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync,writeFileSync,statSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'
          const target=process.env.M1_TARGET_PLATFORM
          const binary=join('dist',target.startsWith('win32-')?'yaoyaoche.exe':'yaoyaoche')
          const bytes=readFileSync(binary)
          const evidence={target,source:'PR13 latest stable TypeScript 7',release:'2.1.317',
            compiled:true,executableSize:statSync(binary).size,
            sha256:createHash('sha256').update(bytes).digest('hex'),
            version:readFileSync(join(process.env.RUNNER_TEMP,'m1-317-six-version.txt'),'utf8').trim()}
          writeFileSync(join(process.env.RUNNER_TEMP,'m1-317-six-host.json'),JSON.stringify(evidence,null,2))
          console.log(JSON.stringify(evidence))
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: latest-stable-standalone-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/m1-317-six-host.json
            ${{ runner.temp }}/m1-317-six-version.txt
          retention-days: 60
          if-no-files-found: warn
