name: PR7中文原始TSX源码恢复批次
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/restore-localized-tsx-batch-pr7.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr7-localized-tsx-port-${{ github.ref }}
  cancel-in-progress: false
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 安装冻结开发工具并准备源码依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 确认原有类型系统正常
        run: node tools/dev/dev.mjs typecheck:all
      - name: 按317源映射恢复原始TSX并迁入中文UI文案
        run: node tools/dev/restore-localized-inline-tsx.mjs --apply
      - name: 逐文件保留能够真正编译的中文TSX实现
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 8); do
            if node tools/dev/dev.mjs typecheck:all > .rebuild/governance/localized-tsx-typecheck.log 2>&1; then
              echo "第 $round 轮原始TSX类型检查通过"
              break
            fi
            mapfile -t broken < <(grep -Eo 'src/[^ ()]+[.]tsx?[(][0-9]+,[0-9]+[)]' .rebuild/governance/localized-tsx-typecheck.log | cut -d '(' -f1 | sort -u || true)
            count=0
            for file in "${broken[@]}"; do
              if [ -f "$file" ] && ! git diff --quiet -- "$file"; then
                echo "涉及当前不兼容接口，保留原组件待按317移植：$file"
                git restore -- "$file"
                count=$((count+1))
              fi
            done
            if [ "$count" -eq 0 ] || [ "$round" -eq 8 ]; then
              cat .rebuild/governance/localized-tsx-typecheck.log
              exit 1
            fi
          done
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
      - name: 生产构建、中文UI和语言格式行为测试
        run: |
          bun build/rebuild.mjs
          node --test tests/chinese-only-ui.test.mjs tests/language-file-contract.test.mjs tests/welcome-layout.test.mjs
          git diff --check
      - name: 将验证通过的真正TSX及中文UI写入PR7
        shell: bash
        run: |
          set -euo pipefail
          git add src
          if git diff --cached --quiet; then
            echo '本批次候选已在主线或受新版接口约束'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '恢复317原始TSX并精准迁移已有中文界面文案'
          for attempt in 1 2 3 4 5; do
            git fetch origin upgrade/2.1.310-m1-evidence
            git rebase origin/upgrade/2.1.310-m1-evidence
            node tools/dev/dev.mjs typecheck:all
            node --test tests/chinese-only-ui.test.mjs
            if git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence; then
              echo '中文TSX恢复已提交并通过最新分支验证'
              exit 0
            fi
          done
          exit 1
      - name: 保留可验证原始组件与残余冲突证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-localized-tsx-ported-batch
          path: |
            .rebuild/governance/localized-original-tsx.json
            .rebuild/governance/localized-tsx-typecheck.log
            .rebuild/governance/type-migration-report.json
          retention-days: 30
          if-no-files-found: warn
