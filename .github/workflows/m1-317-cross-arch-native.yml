name: M1 317 官方跨架构原生模块全量清点

on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/m1-317-cross-arch-native.yml'
      - 'build/probe-official-platform-audio-317.mjs'
      - 'build/official-native-audio-317.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-cross-arch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  official-source:
    name: 逐字节核验317 ${{ matrix.target }} 原生音频模块
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, darwin-x64, win32-arm64]
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载官方317对应架构程序并执行完整SHA校验与模块清点
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          base='https://downloads.claude.ai/claude-code-releases/2.1.317'
          curl --fail --location --silent --show-error --retry-all-errors --retry 5 \
            "$base/manifest.json" -o "$RUNNER_TEMP/manifest.json"
          executable=claude
          if [[ "$target" == win32-* ]]; then executable=claude.exe; fi
          curl --fail --location --silent --show-error --retry-all-errors --retry 5 \
            "$base/$target/$executable" -o "$RUNNER_TEMP/$executable"
          node build/probe-official-platform-audio-317.mjs \
            --binary "$RUNNER_TEMP/$executable" \
            --manifest "$RUNNER_TEMP/manifest.json" --target "$target" \
            --extract-dir "$RUNNER_TEMP/native-verified" \
            | tee "$RUNNER_TEMP/official-audio-$target.json"
          node build/probe-official-platform-audio-317.mjs \
            --binary "$RUNNER_TEMP/$executable" \
            --manifest "$RUNNER_TEMP/manifest.json" --target "$target" \
            --extract-dir "$RUNNER_TEMP/native-verified"
          node --input-type=module -e '
            import {readFileSync} from "node:fs"
            import {createHash} from "node:crypto"
            const records=JSON.parse(readFileSync("build/official-native-audio-317.json","utf8"))
            const os=process.argv[1].split("-")[0], arch=process.argv[1].split("-")[1]
            const name=arch+"-"+os
            const path=process.argv[2]+"/"+name+"/audio-capture.node"
            const actual=createHash("sha256").update(readFileSync(path)).digest("hex")
            if(actual!==records.modules[process.argv[1]].audio_sha256)
              throw Error("Extracted original audio failed frozen release verification")
            console.log("Original audio module verified: "+path)
          ' "$target" "$RUNNER_TEMP/native-verified"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-317-native-audio-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/official-audio-*.json
            ${{ runner.temp }}/native-verified/**/audio-capture.node
          retention-days: 60
          if-no-files-found: warn
