name: PR7 导出类型实际写回与闭环验收
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/pr7-write-inferred-types.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr7-write-inferred-types-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 准备真实依赖与编译器
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 先确认全仓既有代码可类型编译
        run: node tools/dev/dev.mjs typecheck:all
      - name: 从真实调用关系推断并重写导出函数类型
        run: node tools/dev/annotate-export-signatures.mjs --apply
      - name: 真实完整编译与精确隔离异常类型
        run: node tools/dev/apply-inferred-types-safe.mjs
      - name: 完成内容审计、严格编译与源代码构建
        run: |
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs
          node --test tests/chinese-only-ui.test.mjs
          node tools/dev/audit-restored-ui-localization.mjs
          git diff --check
      - name: 同步当前PR最新分支并正式提交通过的TypeScript文件
        shell: bash
        run: |
          set -euo pipefail
          git add src native
          git diff --cached --quiet && { echo '没有安全推断的代码需要写回'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '按语义推断补全真实TypeScript导出类型并完成验证'
          for attempt in 1 2 3 4 5; do
            git fetch origin upgrade/2.1.310-m1-evidence
            git rebase origin/upgrade/2.1.310-m1-evidence
            node tools/dev/dev.mjs typecheck:all
            node tools/dev/audit-restored-ui-localization.mjs
            if git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence; then exit 0; fi
          done
          exit 1
      - name: 上传类型推断与实际验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-export-types-applied
          path: |
            .rebuild/governance/export-types-inference.json
            .rebuild/governance/applied-export-types.json
            .rebuild/governance/type-migration-report.json
          retention-days: 30
          if-no-files-found: warn
