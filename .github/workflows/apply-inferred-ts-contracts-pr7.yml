name: PR7经类型推断验证的TS签名批次
on:
  push:
    branches: [upgrade/2.1.310-m1-evidence]
    paths:
      - '.github/workflows/apply-inferred-ts-contracts-pr7.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr7-inferred-ts-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 安装冻结TypeScript编译器和项目依赖
        run: |
          npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 检查现有代码基线
        run: node tools/dev/dev.mjs typecheck:all
      - name: 将真实类型推断结果补充到源码
        run: node tools/dev/annotate-inferred-ts-contracts.mjs --apply --limit=40
      - name: 保留经类型检查证明正确的源码修改
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 6); do
            if node tools/dev/dev.mjs typecheck:all > .rebuild/governance/inferred-typecheck.log 2>&1; then
              cat .rebuild/governance/inferred-typecheck.log
              break
            fi
            mapfile -t broken < <(grep -Eo '(src|native)/[^ ()]+[.]tsx?[(][0-9]+,[0-9]+[)]' .rebuild/governance/inferred-typecheck.log | cut -d '(' -f1 | sort -u || true)
            reverted=0
            for file in "${broken[@]}"; do
              if [ -f "$file" ] && ! git diff --quiet -- "$file"; then
                echo "编译器拒绝此类型注释，保留原实现供人工改写：$file"
                git restore -- "$file"
                reverted=$((reverted+1))
              fi
            done
            if [ "$reverted" -eq 0 ] || [ "$round" -eq 6 ]; then
              cat .rebuild/governance/inferred-typecheck.log
              exit 1
            fi
          done
          node tools/dev/type-migration-audit.mjs
          node tools/dev/type-migration-strict.mjs
      - name: 生产构建及兼容行为回归
        run: |
          bun build/rebuild.mjs
          node --test tests/language-file-contract.test.mjs tests/m6-gateway-jsonb-317.test.mjs
          git diff --check
      - name: 用最新主线重新生成、验收并提交类型签名
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin upgrade/2.1.310-m1-evidence
            remote=$(git rev-parse origin/upgrade/2.1.310-m1-evidence)
            current=$(git rev-parse HEAD)
            if [ "$remote" != "$current" ]; then
              echo "主线已更新，基于最新源码重做第 $attempt 轮类型迁移"
              git reset --hard "$remote"
              node tools/dev/dev.mjs typecheck:all
              node tools/dev/annotate-inferred-ts-contracts.mjs --apply --limit=40
              for verify_round in 1 2 3 4 5; do
                if node tools/dev/dev.mjs typecheck:all > .rebuild/governance/inferred-typecheck.log 2>&1; then
                  echo "最新源码类型验收通过"
                  break
                fi
                mapfile -t broken < <(grep -Eo '(src|native)/[^ ()]+[.]tsx?[(][0-9]+,[0-9]+[)]' .rebuild/governance/inferred-typecheck.log | cut -d '(' -f1 | sort -u || true)
                reverted=0
                for file in "${broken[@]}"; do
                  if [ -f "$file" ] && ! git diff --quiet -- "$file"; then
                    echo "当前模块缺失可访问的类型声明，保留原始实现：$file"
                    git restore -- "$file"
                    reverted=$((reverted+1))
                  fi
                done
                if [ "$reverted" -eq 0 ] || [ "$verify_round" -eq 5 ]; then
                  cat .rebuild/governance/inferred-typecheck.log
                  exit 1
                fi
              done
              node tools/dev/type-migration-audit.mjs
              node tools/dev/type-migration-strict.mjs
              bun build/rebuild.mjs
              node --test tests/language-file-contract.test.mjs tests/m6-gateway-jsonb-317.test.mjs
              git diff --check
            fi
            git add src native
            if git diff --cached --quiet; then
              echo '没有需要迁移的安全候选或已被其他主线提交覆盖'
              exit 0
            fi
            git commit -m '依据TypeScript真实类型推断完成导出函数签名迁移'
            if git push origin HEAD:refs/heads/upgrade/2.1.310-m1-evidence; then
              echo '类型转换已针对最新主线重新验收并提交'
              exit 0
            fi
            git reset --hard HEAD~1
          done
          echo '主线持续发生并发变更，未回写未经复验的代码'
          exit 1
      - name: 保存类型推断与验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-inferred-ts-contract-migration
          path: |
            .rebuild/governance/inferred-ts-contracts.json
            .rebuild/governance/type-migration-report.json
            .rebuild/governance/inferred-typecheck.log
          retention-days: 30
          if-no-files-found: warn
