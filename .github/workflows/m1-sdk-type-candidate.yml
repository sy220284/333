name: 333 2.1.310 SDK 类型升级候选差分
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-m1-sdk-type-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: 恢复冻结的旧版源码与依赖
        run: |
          npm run dev:bootstrap
          node build/restore-dependencies.mjs
          node build/install-public-deps.mjs
      - name: 保存当前SDK的完整类型错误
        run: |
          mkdir -p .rebuild/governance/sdk-candidate
          set +e
          npm run dev:typecheck:all > .rebuild/governance/sdk-candidate/baseline.log 2>&1
          set -e
          node tools/governance/summarize.mjs types .rebuild/governance/sdk-candidate/baseline.log .rebuild/governance/sdk-candidate/baseline.json
      - name: 隔离升级公开SDK并验证完整类型及重建
        run: |
          npm install --prefix .rebuild/public --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund --save-exact @anthropic-ai/sdk@1.3.0
          node -p "require('./.rebuild/public/node_modules/@anthropic-ai/sdk/package.json').version"
          set +e
          npm run dev:typecheck:all > .rebuild/governance/sdk-candidate/candidate.log 2>&1
          set -e
          node tools/governance/summarize.mjs types .rebuild/governance/sdk-candidate/candidate.log .rebuild/governance/sdk-candidate/candidate.json
          node -e "const f=require('fs'); const a=JSON.parse(f.readFileSync('.rebuild/governance/sdk-candidate/baseline.json')); const b=JSON.parse(f.readFileSync('.rebuild/governance/sdk-candidate/candidate.json')); console.log('Baseline errors:',a.total,'candidate errors:',b.total,'net change:',b.total-a.total)"
          bun build/rebuild.mjs
          bun dist/cli.js --version
          bun dist/cli.js --help > /dev/null
      - name: 保存两版真实类型诊断与新SDK构建证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-1-3-type-and-build-comparison
          path: .rebuild/governance/sdk-candidate/
          if-no-files-found: error
          retention-days: 30
