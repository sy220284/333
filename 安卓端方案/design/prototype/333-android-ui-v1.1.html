function voiceSheet(){sheet('语音转文字',`<p>原型只展示交互；不会调用麦克风。真实 Android 应用通过系统授权、录音与转写，再由你决定是否发送。</p><div class="notice">${toggles.recording?'录音中（原型动画）':'未开始录音'} · 所有文字先进入草稿</div><button class="action primary" onclick="toggles.recording=!toggles.recording;voiceSheet()">${toggles.recording?'停止录音':'开始录音（演示）'}</button><button class="action secondary" style="margin-top:9px;width:100%" onclick="composerDraft+='语音转写示例';closeSheet();render();toast('转写示例已加入草稿')">加入输入草稿</button>`)}
function capabilitiesView(){return `<div class="eyebrow">EXTENSIONS / 02</div><h1>能力，按需要出现。</h1><p class="lead">常用方法一眼就能找到。工具执行、鉴权刷新和内部日志由系统接管。</p>
 ${section('立即可用',links(['skills','plugins','mcp']))}
 ${section('连接外部操作',links(['browser','computer']))}
 <details class="disclosure"><summary>定时与事件任务 <span>你明确创建时才启用</span></summary>${links(['schedule'])}</details>
 <div class="quiet-note">浏览器/电脑操作会先检查运行环境与授权。未经用户发起，不会自动创建日程或启动外部控制。</div>`}
function executionView(id){if(id==='task-center')return `<div class="eyebrow">ACTIVITY / 03</div><h1>任务在运行，结果可追踪。</h1><p class="lead">只要有任务需要处理，状态就会出现在这里。</p>
 ${approvalDecision==='pending'?`<button class="attention-action" onclick="go('approval')"><span>${icon('shield')}</span><span><strong>1 项操作等待确认</strong><small>检查执行命令与工作区权限</small></span>${tag('待决定','warn')}</button>`:notice(approvalDecision==='allowed'?'本次工具执行已经允许。':'本次工具执行已拒绝。')}
 ${section('现在进行中',localRows([['检查 Android 关键功能','正在核对运行轨迹','task-detail']]))}
 ${section('过程与后台作业',links(['activity','jobs']))}
 <details class="disclosure"><summary>协作与长期任务 <span>需要时展开</span></summary>${links(['agent-team','workflow','goal','plan'])}</details>
 <details class="disclosure"><summary>高级执行工具 <span>需可用运行环境</span></summary>${links(['terminal'])}</details>`;
 return legacyExecutionView(id)}
function fileView(id){if(id==='projects')return `<div class="eyebrow">PROJECTS / 02</div><h1>项目与成果。</h1><p class="lead">文件、代码变更与版本审阅都围绕当前项目展开。</p>
 <div class="project-primary"><span>${icon('folder')}</span><div><strong>Android · 移动端改造</strong><small>/workspace/android · 原型示例</small></div>${tag('当前项目','good')}</div>
 ${section('常用操作',links(['files','diff']))}
 ${section('协作交付',links(['pull-requests']))}
 <details class="disclosure"><summary>Git 高级操作 <span>检测到 Git 环境后显示</span></summary>${links(['worktree'])}</details>`;
 if(id==='file-preview')return legacyFileView(id)+`<div class="chipbar"><button class="chip" onclick="fileActionSheet()">文件操作（按类型显示）</button><button class="chip" onclick="go('chat')">引用到任务</button></div>`;
 if(id==='files')return legacyFileView(id)+`<div class="quiet-note">搜索、编辑、预览等从文件上下文操作；Word / Excel / PPT 的转换在对应文件类型下出现。</div>`;
 return legacyFileView(id)}
function settingsView(id){if(id==='settings')return `<div class="eyebrow">PERSONALIZE / 04</div><h1>设置。</h1><p class="lead">日常只需要账号、模型和外观。运行环境细节按需要查看。</p>
 ${section('日常设置',links(['models','account','appearance','sandbox']))}
 <details class="disclosure"><summary>环境与排障 <span>状态异常时重点提示</span></summary>${links(['runtime','diagnostics','usage'])}</details>
 ${section('支持',links(['feedback']))}`;
 if(id==='diagnostics')return `<div class="eyebrow">SYSTEM / DIAGNOSTICS</div><h1>运行诊断。</h1><p class="lead">先显示真正影响任务的问题，再提供可复核的原始记录。</p>
 <div class="diagnostic-line">${icon('check')} <strong>原型状态正常</strong><small>未连接真实 Harness 核心</small></div>
 ${section('遇到问题时',links(['runtime','account','mcp']))}
 <details class="disclosure"><summary>技术详情 <span>仅在主动排障时展开</span></summary>${links(['logs','inspector','stats'])}
 <div class="debug-index"><strong>由后台维护</strong><p>会话事件持久化、Node PTC、模型路由/重试、日志采样、搜索索引、凭据刷新、文件结果裁剪、运行时注册和 SDK/ACP 协议接入。它们自动执行，并通过相关任务状态或诊断信息反馈。</p></div></details>`;
 return legacySettingsView(id)}
function renderBottom(s){if(['home','chat'].includes(s.id)){legacyRenderBottom(s);const c=document.getElementById('composerText');if(c){c.setAttribute('rows','2');const box=c.parentElement;box.classList.add('has-inline-mic');const b=document.createElement('button');b.className='composer-mic';b.type='button';b.setAttribute('aria-label','语音输入');b.innerHTML=icon('mic');b.onclick=voiceSheet;box.insertBefore(b,box.querySelector('.composer-bottom'));}return;}
 if(s.id==='approval'&&approvalDecision!=='pending'){document.getElementById('bottomAction').innerHTML=`<div class="footer-actions"><button class="action primary" onclick="go('chat')">返回当前任务</button></div>`;return;}if(['approval','questions','file-edit','review','schedule-edit','mcp-detail','plugin-detail','task-detail','terminal','plan','goal'].includes(s.id))legacyRenderBottom(s);else document.getElementById('bottomAction').innerHTML=''}
function scheduleView(id){if(id==='schedule')return head('自动化任务','由你主动创建的计划才会执行；示例没有真实任务或后台日程。')+(creationCount>0?panel('本地演示计划',`<p>已模拟创建 ${creationCount} 条计划。没有提交到系统。</p>${tag('仅模拟','warn')}`):panel('尚无任务',`<p>没有创建任何定时或事件触发任务。</p><button class="action primary" onclick="go('schedule-edit')">创建一项计划</button>`))+`<details class="disclosure"><summary>外部事件来源 <span>按需配置</span></summary>${links(['webhook'])}</details>`;return legacyScheduleView(id)}
function updateMoreReadability(){document.getElementById('navbtn').setAttribute('aria-expanded',drawerOpen?'true':'false')}

boot();

</script></body></html>
