document:()=>`<div class="eyebrow" style="margin-bottom:18px">DOCUMENT / 03</div><div class="doc"><div class="caption" style="color:#778652">03 / 架构笔记</div><h2>从复杂中找到秩序</h2><p>好的开发工具把复杂的能力留给系统，把清楚的下一步交给使用者。</p><p>在移动端，首屏承载当前任务。项目、工具、权限和运行状态，在需要时自然呈现。</p><p>对话仍是持续的工作现场。所有过程都来自核心的真实事件，历史记录与结果使用同一来源。</p><p style="font-size:12px;color:#8c857b">— 333 Android 设计评审文稿（示例）</p></div><div class="split" style="margin-top:21px">${btn('目录',"toast('目录展开：03 架构笔记')",'btn-outline')}${btn('收藏',"toast('设计演示：已收藏')",'btn-outline')}</div>`,

tasks:()=>`${head('RUN / ACTIVITY','正在整理项目。','从每个事件看见执行进展和结果。')}${chip('运行中','blue')}<div class="timeline"><div class="tl"><strong>任务已创建</strong><div class="caption">10:02 · 读取项目结构</div></div><div class="tl"><strong>扫描 333 接口</strong><div class="caption">10:03 · 会话/消息/工具</div></div><div class="tl active"><strong>检查 Android 适配</strong><div class="caption">10:05 · 正在核对运行时约束</div></div></div><div class="card subtle"><div class="statusline"><span class="dot blue"></span><strong>当前任务</strong></div><p class="caption">运行中与完成状态只能由真实核心事件确认；此处为界面动态示例。</p></div>${btn('暂停',"toast('演示模式：未发送真实停止请求')",'wide btn-outline')}${btn('查看后台输出',"nav('terminal')",'wide btn-text')}`,
terminal:()=>`${head('TERMINAL / SESSION','实时终端。','保留原始字符与退出状态，优先显示有价值的输出。')}<div class="statusline">${chip('示例会话','grey')} <span>zsh · workspace</span></div><div class="code" style="min-height:300px;margin-top:18px"><span style="color:#58ddbb">~/project</span> $ ls<br>android-app/    assets/    docs/<br>tools/         design/<br><br><span style="color:#58ddbb">~/project</span> $ git status<br>On branch feat/android-plan-foundation<br>nothing to commit, working tree clean<br><br><span style="color:#58ddbb">~/project</span> $ <span style="color:#5dd7f6">▌</span></div><div class="space"></div><input class="input mono" placeholder="命令输入需真实 PTY 连接" disabled><p class="caption">Android 独立 PTY 后端与二进制运行环境尚待设备验证。</p>` ,
approval:()=>`${head('SECURITY / REVIEW','允许这项操作？','审批先解释范围，再请你做明确选择。')}<div class="card"><div class="row" style="border:0"><div class="row-icon">${icon('shield')}</div><div class="row-body"><strong>读取选定项目文件</strong><small>来源 · 当前对话的工具调用</small></div></div><div class="hair"></div><p style="font-size:14px">助手请求读取 <b>移动端重构</b> 项目下的文件，以生成架构梳理报告。</p><div class="card subtle"><div class="caption">授权范围</div><div class="mono" style="margin-top:6px">/workspace/android-plan/**</div><div class="caption" style="margin-top:9px">只读 · 本次调用 · 可拒绝</div></div></div>${btn('查看并确认',"openSheet('approval')",'wide')}<div style="height:10px"></div>${btn('取消本次请求',"toast('设计演示：已取消')",'wide btn-outline')}`,
questions:()=>`${head('INTERACTION / INPUT','还需要一个选择。','请回答助手在当前任务中提出的问题。')}<div class="card"><div class="eyebrow">USER QUESTION</div><h3>本次优先审查哪一部分？</h3><p class="caption">选项来自模型实际请求；这里为示例状态。</p><div id="qopts"></div><div class="space"></div>${btn('提交选择',"toast('设计演示：选择已提交')",'wide')}</div>` ,
extensions:()=>`${head('EXTENSIONS / HUB','按需添加能力。','常用能力自动可发现，复杂设置进入详情。')}<input class="input" placeholder="搜索技能、MCP、插件…" onfocus="nav('search')"><div class="section">你的扩展</div>${row('技能与预设','选择适合当下工作的执行方式','model','skills')}${row('MCP 工具连接','查看服务状态与已授权工具','plug','mcp')}${row('插件与市场','发现、安装和管理能力','tools','extensions')}<div class="section">状态与提示</div><div class="card subtle"><div class="statusline"><span class="dot"></span>当前尚未连接真实扩展服务</div><p class="caption">真实安装、更新和调用需要 Host 运行时。配置页面仅在用户选择某项能力后显示。</p></div>`,
mcp:()=>`${head('MCP / SERVICES','已连接的工具。','各服务状态和权限直接来自运行中的核心。')}${row('GitHub','示例 · API 服务','plug','extensions',chip('示例'))}${row('文件系统','示例 · stdio 服务','file','files',chip('示例'))}${row('浏览器工具','示例 · 待连接','cloud','extensions',chip('未连接','amber'))}<div class="space"></div>${btn('连接新 MCP 服务',"openSheet('mcp')",'wide btn-outline')}`,
skills:()=>`${head('AGENT / PRESETS','选择工作方式。','让技能与工具围绕当前任务组合。')}${row('标准助手','综合推理与工具使用','model','chat',chip('默认','blue'))}${row('项目协作','文件、终端、审查','tools','chat')}${row('创作工作室','长文本规划与编辑','file','chat')}${row('技能管理','查看已安装技能和来源','project','extensions')}<p class="caption">实际预设清单由 agentPresets Remote 提供；示例项仅展示信息结构。</p>` ,
models:()=>`${head('MODEL / CATALOG','选择模型。','只有当前 Host 可调用的模型会进入实际选择列表。')}${row('DeepSeek V4 Flash','示例 · 低延迟','model','chat',chip('当前','blue'))}${row('DeepSeek 推理模型','示例 · 高推理强度','model','chat')}${row('其他提供商','通过设置与插件提供','plug','settings')}<div class="space"></div>${btn('模型设置',"nav('settings')",'wide btn-outline')}`,
account:()=>`${head('ACCOUNT / PROFILE','账号与授权。','登录状态、凭据与模型路由由 Host 安全管理。')}<div class="card"><div class="row" style="border:none"><div class="row-icon">${icon('account')}</div><div class="row-body"><strong>DeepSeek 账号</strong><small>未登录 · 本地演示</small></div>${chip('未连接','amber')}</div></div>${btn('通过浏览器登录',"toast('此为静态演示；实际登录由 account Remote 发起')",'wide')}${row('模型供应商','由核心路由的可用目录','model','models')}${row('账户通知','从登录会话读取','task','account')}<p class="caption">令牌仅由 Host 管理，安卓界面不得展示账户凭据。</p>` ,
permissions:()=>`${head('SECURITY / SCOPE','权限，清清楚楚。','每一次访问都有明确的来源、范围和结果。')}<div class="card"><div class="row" style="border:none"><div class="row-icon">${icon('shield')}</div><div class="row-body"><strong>工作区写入</strong><small>示例 · 实际策略以 Host 为准</small></div>${chip('示例','grey')}</div><div class="hair"></div><p class="caption">允许在选定工作区内修改文件。越界操作会按核心策略请求审批或拒绝。</p></div>${row('只读','查看文件与信息','shield','permissions')}${row('工作区写入','限制在选定目录内','project','permissions')}${row('完整访问','需明确授权并提示范围','tools','permissions')}<p class="caption">Android 本机隔离实现尚待验证。当前演示仅展示计划中的控制方式。</p>` ,
diagnostics:()=>`${head('RUNTIME / HEALTH','核心运行诊断。','告诉你真实可用到哪一步，并给出对应操作。')}<div class="card"><div class="statusline"><span class="dot"></span>未安装 · 本机 Runtime</div><h2 style="font-size:20px;line-height:1.3">独立运行尚未就绪</h2><p class="caption">可用的远程连接和独立运行是不同的完成条件。</p></div><div class="timeline"><div class="tl"><strong>Android 客户端代码</strong><div class="caption">Compose 工程已纳入 333 GitHub PR</div></div><div class="tl active"><strong>Node 与 Host 二进制</strong><div class="caption">等待可信构建产物、签名和哈希检查</div></div><div class="tl"><strong>PTY 与沙箱</strong><div class="caption">等待 Android 16/17 真机测试</div></div><div class="tl"><strong>模型与工具链</strong><div class="caption">需要真实会话、工具调用、重启恢复验证</div></div></div>${btn('查看验证说明',"toast('验收文档：安卓端方案/docs/04-开发与验收.md')",'wide btn-outline')}` ,
settings:()=>`${head('SETTINGS / PERSONALIZE','偏好与安全。','保持日常页面简单，把复杂设置留在这里。')}<div class="card">${row('显示与外观', '亮色 / 暗色 / 随系统','settings','settings',`<span class="switch ${darkMode?'on':''}" onclick="event.stopPropagation();toggleDark()"></span>`)}${row('账户与登录','DeepSeek 账号、凭据保护','account','account')}${row('默认模型','模型和推理强度','model','models')}${row('执行权限','沙箱、审批与限制','shield','permissions')}${row('核心诊断','检查本机运行组件','device','diagnostics')}</div><p class="caption">设计系统：原生材质 + 精密仪器 · UI 技能 2.4</p>` ,
search:()=>`${head('SEARCH / COMMAND','找到下一步。','搜索会话、项目、文件和命令。')}<input class="input" id="searchinput" placeholder="搜索文件、任务或指令" oninput="searchResults(this.value)"><div class="section">最近使用</div><div id="results">${row('移动端架构梳理','历史会话','chat','history')}${row('UI 交互设计','项目文档','file','document')}${row('MCP 服务','扩展中心','plug','mcp')}</div>` ,
schedule:()=>`${head('SCHEDULE / TASKS','计划任务。','所有计划都需要明确的创建操作。')}<div class="card subtle"><h3 style="margin:0 0 7px">暂无计划中的任务</h3><p class="caption">适合需要持续跟进的项目进度或定期报告。由 schedule Remote 提供实际列表。</p></div>${btn('新建计划任务',"openSheet('schedule')",'wide btn-outline')}`,
goals:()=>`${head('GOAL / WORK','明确目标，持续推进。','目标、步骤和结果来自同一个 Agent 会话。')}<div class="card"><h3>为项目完成 Android 移植</h3><p class="caption">示例目标 · 设计说明</p><div class="timeline"><div class="tl"><strong>读取接口能力</strong><div class="caption">已梳理</div></div><div class="tl active"><strong>原生 UI 与适配</strong><div class="caption">实施中</div></div><div class="tl"><strong>本机运行验收</strong><div class="caption">尚未完成</div></div></div></div>`};
function nav(key){active=key in names?key:'chat';toggleDrawer(false);document.getElementById('pageTitle').textContent=names[active];document.getElementById('pageSub').textContent=active==='chat'?'Android · 本机核心待就绪':'设计演示 · 示例数据';document.getElementById('content').innerHTML=active==='chat'?chatPage():`<div class="page">${markup[active] ? markup[active]() : ''}</div>`;document.getElementById('content').scrollTop=0;document.getElementById('modelBtn').style.display=active==='chat'?'grid':'none';document.getElementById('newBtn').style.display=active==='chat'?'grid':'none';drawNav();hydrate();history.replaceState({},'',`#${active}`)}function drawNav(){let html='';for(const [k,list] of Object.entries(section)){html+=`<div class="eyebrow" style="margin:18px 13px 6px">${{conversation:'WORK',extension:'EXTEND',system:'PERSONAL'}[k]}</div>`;for(const [id,n,ic] of list)html+=`<button class="row ${active===id?'active':''}" onclick="nav('${id}')"><span class="row-icon">${icon(ic)}</span><span class="row-body"><strong>${n}</strong></span></button>`;}document.getElementById('drawerItems').innerHTML=html}function toggleDrawer(show){document.getElementById('drawer').classList.toggle('show',show);document.getElementById('shade').classList.toggle('show',show)}function chatPage(){return `<div class="chat-area"><div class="feed">${chatMessages.length?chatMessages.map(m=>m.role==='user'?`<div class="bubble">${x(m.text)}</div>`:`<div class="answer"><div class="role">DeepSeek Harness · 演示回复</div>${x(m.text).replaceAll('\n','<br>')}</div>`).join(''):`<div class="intro"><div class="eyebrow">NEW CONVERSATION</div><h1>今天，想解决什么？</h1><p class="lead">描述目标，助手将围绕同一个项目持续推进工作。</p><div class="section">你可以这样开始</div><button class="suggestion" onclick="demoChat('帮我梳理整个项目的接口')">帮我梳理整个项目的接口 <span>›</span></button><button class="suggestion" onclick="demoChat('检查一下最近修改')">检查一下最近修改 <span>›</span></button><button class="suggestion" onclick="demoChat('整理一份安卓适配方案')">整理一份安卓适配方案 <span>›</span></button></div>`}</div><div class="compose"><div class="inputwrap"><textarea id="chatinput" rows="1" placeholder="描述你的需求…" oninput="draft=this.value"></textarea><button class="send" aria-label="发送" onclick="sendDemo()">${icon('send')}</button></div><div class="caption" style="margin:7px 10px 0">设计演示：本页不会向核心发送消息</div></div></div>`}function hydrate(){if(active==='questions'){document.getElementById('qopts').innerHTML=['先梳理通信接口','优先验证本机运行时','先完善 UI 与交互'].map((t,i)=>`<label class="row"><input type="radio" name="examplequestion" ${i===0?'checked':''} style="accent-color:var(--accent);width:18px;height:18px"><span class="row-body">${t}</span></label>`).join('')}}function demoChat(text){draft=text;sendDemo()}function sendDemo(){const v=draft.trim()||(document.getElementById('chatinput')?.value||'').trim();if(!v)return;chatMessages.push({role:'user',text:v},{role:'assistant',text:'这是 Android UI 设计用的示例回复。真实版本会通过 session/prompt 发送内容，再由 session/follow 恢复历史与实时消息。\n\n当前展示清晰的信息层级、消息状态和可操作的 UI。'});draft='';nav('chat')}
function openSheet(key){currentSheet=key;const obj={model:['选择模型','模型目录来自当前 Host，而非 Android 内置的固定列表。',`<div class="card subtle">${row('DeepSeek V4 Flash','示例 · 默认模型','model','models',chip('示例','blue'))}${row('推理强度','标准 / 高','settings','models')}</div>`,'查看模型目录',"closeSheet();nav('models')"],approval:['本次文件读取授权','读取当前工作区内的指定文件，不授予全局磁盘访问。',`<div class="card subtle"><div class="caption">范围 · /workspace/android-plan/**</div><b>仅本次有效</b></div><div class="split">${btn('取消',"closeSheet();toast('演示：已取消')",'btn-outline')}${btn('仅本次允许',"closeSheet();toast('演示：已允许一次')")}</div>`,'',''],connect:['连接 Harness Host','真实客户端会通过 /connect 交换授权 Cookie，再连接 Remote。',`<input class="input" placeholder="https://host.example/?token=…" id="hostlink"><p class="caption">为保护凭据，演示不会尝试外部网络请求。</p>`,'关闭演示',"closeSheet()"],mcp:['添加 MCP 服务','实际设置会读取 Host 注册的 MCP 参数与安全策略。',`<div class="card subtle"><b>HTTP 服务</b><p class="caption">连接目标、认证与工具发现由 MCP 管理器控制。</p></div>`,'返回扩展中心',"closeSheet();nav('extensions')"],schedule:['创建计划任务','需要明确的时间和执行目标，只有实际提交才创建。',`<input class="input" placeholder="任务名称（示例）"><div class="space"></div><input class="input" placeholder="执行时间（示例）">`,'取消',"closeSheet()"]};const a=obj[key]||obj.model;document.getElementById('sheet').innerHTML=`<div class="handle"></div><h2>${a[0]}</h2><p class="lead" style="margin-bottom:15px">${a[1]}</p>${a[2]}${a[3]?`<div class="space"></div>${btn(a[3],a[4],'wide')}`:''}`;document.getElementById('sheetShade').classList.add('show')};function closeSheet(){document.getElementById('sheetShade').classList.remove('show')}function toggleDark(){darkMode=!darkMode;document.body.classList.toggle('dark',darkMode);nav('settings')}function searchResults(q){if(!q){document.getElementById('results').innerHTML=row('移动端架构梳理','历史会话','chat','history')+row('UI 交互设计','项目文档','file','document')+row('MCP 服务','扩展中心','plug','mcp');return}const data=[['移动端架构梳理','history','chat'],['UI 交互设计','document','file'],['MCP 服务','mcp','plug'],['文件浏览','files','file'],['任务记录','tasks','task'],['终端','terminal','terminal'],['账户','account','account']];let found=data.filter(v=>v[0].includes(q));document.getElementById('results').innerHTML=found.length?found.map(v=>row(v[0],'设计演示结果',v[2],v[1])).join(''):'<div class="caption" style="padding:20px 0">未找到匹配项目</div>'}function toast(t){const d=document.getElementById('toast');d.textContent=t;d.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>d.classList.remove('show'),2600)}document.getElementById('menu').innerHTML=icon('menu');document.getElementById('modelBtn').innerHTML=icon('model');document.getElementById('newBtn').innerHTML=icon('plus');nav(location.hash.replace('#','')||'chat');
</script></body></html>
